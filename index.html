<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SAAD Hub — PC / スマホ自動切替</title>
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#fff}
  iframe{border:0;width:100%;height:100%;display:block;background:#fff}
  .bar{position:fixed;right:10px;bottom:10px;left:auto;transform:none;z-index:20;
    display:flex;gap:2px;align-items:center;padding:3px;background:rgba(12,18,34,.78);border-radius:999px;
    box-shadow:0 4px 16px rgba(0,0,0,.2);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP",sans-serif;opacity:.72}
  .bar:hover{opacity:1}
  .bar button{border:0;background:transparent;color:rgba(255,255,255,.75);font-size:11px;font-weight:700;
    padding:5px 10px;border-radius:999px;cursor:pointer;white-space:nowrap}
  .bar button[aria-current="true"]{background:#fff;color:#0c1222}
  .bar .hint{display:none}
  @media(max-width:520px) and (pointer:coarse){.bar{display:none}}
</style>
</head>
<body>
<iframe id="frame" title="SAAD Hub" allow="clipboard-write"></iframe>
<div class="bar" id="bar" role="group" aria-label="表示モード">
  <button type="button" data-v="auto">自動</button>
  <button type="button" data-v="pc">PC</button>
  <button type="button" data-v="mobile">スマホ</button>
  <span class="hint" id="hint">幅820px未満 → ジョブ型スマホ</span>
</div>
<script>
(function(){
  const BP=820;
  const frame=document.getElementById('frame');
  const bar=document.getElementById('bar');
  const hint=document.getElementById('hint');
  const mq=window.matchMedia('(max-width:'+BP+'px)');
  let lastMode=null;

  function forced(){
    const q=new URLSearchParams(location.search);
    const v=(q.get('v')||q.get('view')||'').toLowerCase();
    if(v==='pc'||v==='desktop'||v==='d') return 'pc';
    if(v==='m'||v==='mobile'||v==='sp') return 'mobile';
    return 'auto';
  }
  function effective(){
    const f=forced();
    if(f==='pc') return 'pc';
    if(f==='mobile') return 'mobile';
    return mq.matches ? 'mobile' : 'pc';
  }
  /* PC版 / ジョブ型スマホ版は別ファイル。古いGitHub Mobileシェルは使わない */
  function srcFor(mode){
    const base=location.pathname.replace(/[^/]*$/,'');
    return mode==='mobile'
      ? base+'saad-mobile-hub.html?embed=1&_r=20260925f'
      : base+'saad-github-hub.html?pc=1&_r=20260925f';
  }
  function syncBar(mode){
    const f=forced();
    bar.querySelectorAll('[data-v]').forEach(b=>{
      if(b.dataset.v===f) b.setAttribute('aria-current','true');
      else b.removeAttribute('aria-current');
    });
    hint.textContent = mode==='mobile'
      ? 'ジョブ型スマホUI（報告・承認）'
      : 'PC台帳UI（GitHub型）';
    document.title = mode==='mobile' ? 'SAAD Hub — スマホ' : 'SAAD Hub — PC';
  }
  function apply(forceReload){
    const mode=effective();
    syncBar(mode);
    if(!forceReload && lastMode===mode) return;
    lastMode=mode;
    frame.src=srcFor(mode);
  }
  bar.querySelectorAll('[data-v]').forEach(b=>{
    b.onclick=()=>{
      const u=new URL(location.href);
      if(b.dataset.v==='auto') u.searchParams.delete('v');
      else u.searchParams.set('v', b.dataset.v);
      history.replaceState(null,'',u);
      apply(true);
    };
  });
  apply(true);
  mq.addEventListener('change', ()=>{ if(forced()==='auto') apply(true); });
})();
</script>
</body>
</html>
