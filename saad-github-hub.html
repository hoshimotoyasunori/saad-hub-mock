/* ================= CRM（顧客レコード＝リポの正本データ相当） ================= */
function custStats(cid){
  const list=custIssues(cid);
  const deals=list.filter(i=>i.kind==='deal');
  const activeDeals=deals.filter(i=>i.open);
  const leads=list.filter(i=>i.kind==='lead'&&i.open);
  return {deals, activeDeals, leads, all:list};
}
const CRM_PAGE_SIZE=25;
function crmOrgOptions(){
  const rows=state.crmAxis==='property' ? propRows() : crmRows();
  const domains=[...new Set(rows.map(r=>r.domain).filter(Boolean))].sort();
  const branches=[...new Set(rows.filter(r=>!state.crmDomain||r.domain===state.crmDomain).map(r=>r.branch).filter(Boolean))].sort();
  return {domains, branches};
}
function crmActiveFilters(){
  const a=[];
  if(state.crmDomain) a.push({k:'domain', l:`部門: ${state.crmDomain}`});
  if(state.crmBranch) a.push({k:'branch', l:`拠点: ${state.crmBranch}`});
  if(state.crmRegi) a.push({k:'regi', l:`登録: ${state.crmRegi}`});
  return a;
}
function crmClearFilter(k){
  if(k==='domain'){ state.crmDomain=''; state.crmBranch=''; }
  else if(k==='branch') state.crmBranch='';
  else if(k==='regi') state.crmRegi='';
  else { state.crmDomain=''; state.crmBranch=''; state.crmRegi=''; }
  state.crmPage=0;
}
function crmFiltered(){
  const q=(state.crmQ||'').trim();
  let list=state.crmAxis==='property' ? propRows() : crmRows();
  if(state.crmDomain) list=list.filter(r=>r.domain===state.crmDomain);
  if(state.crmBranch) list=list.filter(r=>r.branch===state.crmBranch);
  if(state.crmRegi) list=list.filter(r=>r.regi===state.crmRegi);
  if(q){
    list=list.filter(r=>{
      const hay=state.crmAxis==='property'
        ? (r.name+(r.structure||'')+(r.addr||''))
        : (r.name+r.kind);
      return hay.includes(q);
    });
  }
  return list;
}
function crmTableHtml(){
  const list=crmFiltered();
  const pages=Math.max(1, Math.ceil(list.length/CRM_PAGE_SIZE));
  if(state.crmPage>=pages) state.crmPage=pages-1;
  const start=state.crmPage*CRM_PAGE_SIZE;
  const slice=list.slice(start, start+CRM_PAGE_SIZE);
  const body = state.crmAxis==='property'
    ? slice.map(r=>`<tr data-prop="${r.id}" style="cursor:pointer">
        <td><b>${r.name}</b>${r.gen?'':' <span class="ref">詳細あり</span>'}</td>
        <td>${r.structure||'—'}</td>
        <td>${r.regi==='仮'?'<span class="pill wait">仮登録</span>':'<span class="pill">本登録</span>'}</td>
        <td class="orgcell">${r.domain}・${r.branch.replace('営業所','')}</td>
        <td>${r.custs}</td>
        <td>${r.active||'—'}</td>
        <td>${r.until}${r.warn?' <span class="warn-badge">期限間近</span>':''}</td>
        <td>${r.last}</td>
      </tr>`).join('')
    : slice.map(r=>`<tr data-cust="${r.id}" style="cursor:pointer">
        <td><b>${r.name}</b>${r.gen?'':' <span class="ref">詳細あり</span>'}</td>
        <td>${r.kind}</td>
        <td>${r.regi==='仮'?'<span class="pill wait">仮登録</span>':'<span class="pill">本登録</span>'}</td>
        <td class="orgcell">${r.domain}・${r.branch.replace('営業所','')}</td>
        <td>${r.props}</td>
        <td>${r.active||'—'}</td>
        <td>${r.until}${r.warn?' <span class="warn-badge">期限間近</span>':''}</td>
        <td>${r.last}</td>
      </tr>`).join('');
  return {body, total:list.length, start, end:Math.min(start+CRM_PAGE_SIZE, list.length), pages};
}

function openCustMerge(keepId){
  const keep=CUSTOMERS[keepId]; if(!keep) return;
  const others=Object.values(CUSTOMERS).filter(x=>x.id!==keepId && !x.disabled && !x.mergedInto);
  openSimpleModal(`名寄せ — ${keep.name} に統合`, `
    <p class="quiet">統合元の顧客を選ぶと、案件・物件・契約を <b>${keep.name}</b> に寄せ、統合元は無効になります。</p>
    <div class="form-grid"><div class="full"><label>統合元（消える側）</label>
      <select name="src">${others.map(o=>`<option value="${o.id}">${o.name}（${o.domain}・${o.branch}）</option>`).join('')}</select></div>
      <div class="full"><label>理由（必須）</label><input name="reason" placeholder="例: 重複登録のため"></div></div>
    <div class="actions" style="margin-top:12px"><button class="bp" type="button" data-ok>統合する</button><button class="bg" type="button" data-cx>キャンセル</button></div>`,
  (box, close)=>{
    box.querySelector('[data-cx]').onclick=close;
    box.querySelector('[data-ok]').onclick=()=>{
      const srcId=box.querySelector('[name=src]').value;
      const reason=(box.querySelector('[name=reason]').value||'').trim();
      if(!srcId){ alert('統合元を選んでください'); return; }
      if(!reason){ alert('理由は必須です'); return; }
      const src=CUSTOMERS[srcId];
      (src.propertyIds||[]).forEach(pid=>{ if(!(keep.propertyIds||[]).includes(pid)){ keep.propertyIds=keep.propertyIds||[]; keep.propertyIds.push(pid); }
        const p=PROPERTIES[pid]; if(p){ p.customers=(p.customers||[]).map(x=>x===srcId?keepId:x); if(!(p.customers||[]).includes(keepId)) (p.customers=p.customers||[]).push(keepId); }
      });
      (src.contracts||[]).forEach(k=>{ keep.contracts=keep.contracts||[]; keep.contracts.push(Object.assign({},k)); });
      issues.filter(i=>i.customer===srcId).forEach(i=>{ i.customer=keepId; addEvent(i, ev('sys', meShort(), `顧客名寄せ: ${src.name} → ${keep.name}`)); });
      src.disabled=true; src.mergedInto=keepId;
      recordChg(keep,'名寄せ',src.name,keep.name,'名寄せ');
      mlog(keep,`名寄せ: ${src.name} を統合（${reason}）`);
      mlog(src,`名寄せ先 ${keep.name} へ統合（${reason}）`);
      audit('名寄せ', `${src.name} → ${keep.name}: ${reason}`, keepId);
      notify('jimu', `顧客を名寄せしました: ${src.name} → ${keep.name}`, null, {cust:keepId});
      close(); state.customer=keepId; render();
    };
  });
}

function mCard(i){

  return `<button type="button" class="m-card${urgent?' urgent':''}${i.status==='Blocked'?' blocked':''}" data-open="${i.id}">
    <div class="m-top"><span class="kind ${KC[i.kind]}">${KIND[i.kind]}</span><span class="ref">${i.ref}</span>${pill(i.status)}</div>

  </button>`;
}
function isDesc(x, rootId){
  let p=x.parent;
  while(p){ if(p===rootId) return true; const par=byId(p); p=par&&par.parent; }
  return false;
}

const CHANGE_REQS=[];
function recordChg(target, field, from, to, via){
  const text=`変更${via?`（${via}）`:''}: ${field} 「${from||'（空）'}」→「${to||'（空）'}」`;
  if(target && target.tl) addEvent(target, ev('sys', meShort(), text));

  (target.chg=target.chg||[]).unshift({at:nowHM(), who:meShort(), field, from, to, via:via||'編集'});
  audit('変更', text, (target&&(target.ref||target.name||target.id))||'—');
  return text;
}
function rememberPrev(it){ if(it && it.status!=null) it._prev={status:it.status, at:nowHM()}; }
function setStatus(it, next, via){
  if(!it || it.status===next) return;
  const from=it.status; rememberPrev(it); it.status=next;
  recordChg(it, '状態', from, next, via||'状態変更');
}

        status:'確認待ち', reason:vals.reason, changes, at:nowHM(), apply:opts.apply};
      CHANGE_REQS.unshift(rec);

function openUndoModal(it){

function confirmChgReq(rec, ok){
  if(!rec || rec.status!=='確認待ち') return;
  const target=rec.targetKind==='customer'?CUSTOMERS[rec.targetId]
    :rec.targetKind==='property'?PROPERTIES[rec.targetId]
    :rec.targetKind==='vendor'?(VENDORS||[]).find(v=>v.id===rec.targetId)
    :rec.targetKind==='issue'?byId(rec.targetId):null;
  if(ok){
    rec.status='確定';
    if(typeof rec.apply==='function') rec.apply(rec);
    else if(target){
      rec.changes.forEach(c=>{
        const from=c.from;
        if(rec.targetKind==='customer'){
          if(c.k==='name') target.name=c.to; else if(c.k==='addr') target.addr=c.to; else if(c.k==='contact') target.contact=c.to;
        } else if(rec.targetKind==='property'){
          if(c.k==='addr') target.addr=c.to; else if(c.k==='structure') target.structure=c.to;
        } else if(rec.targetKind==='vendor'){
          if(c.k==='ins') target.ins=c.to; else if(c.k==='name') target.name=c.to;
        }
        recordChg(target, c.field, from, c.to, '変更申請の確定');
      });
    }
    if(target){ delete target.pendingChg; delete target.pendingLabel; }
    notify(rec.by, `変更が確定されました: ${rec.label}`, null, rec.targetKind==='customer'?{cust:rec.targetId}:rec.targetKind==='property'?{prop:rec.targetId}:{screen:'myreq'});
  } else {
    rec.status='差戻し';
    if(target){ delete target.pendingChg; delete target.pendingLabel; }
    if(target && target.tl) addEvent(target, ev('sys', meShort(), `変更申請が差戻し: ${rec.label}`));
    notify(rec.by, `変更申請が差戻されました: ${rec.label}`, null, {screen:'myreq'});
  }
  mlog(rec, ok?'確定':'差戻し');
}

function cancelImpact(root){

function insertIssue(o){
  if(!o.parent){ issues.push(o); return o; }
  const par=byId(o.parent); o.depth=par.depth+1;
  const inSub=i=>{ let p=i.parent; while(p){ if(p===o.parent) return true; const x=byId(p); p=x&&x.parent; } return false; };
  let idx=issues.indexOf(par);
  issues.forEach((i,k)=>{ if(inSub(i)) idx=Math.max(idx,k); });
  issues.splice(idx+1,0,o); state.expanded.add(o.parent);
  return o;
}

function parentForQuote(dealId){
  const ph=kids(dealId).find(k=>k.kind==='phase' && k.title.includes('商談'));
  return ph ? ph.id : dealId;

function ringiRoute(type, amount, disc){
  if(disc>12 || amount>=1000000 || ['売上訂正','解約','顧客情報変更'].includes(type)) return 'kanri';
  return 'leader';
}
function addRingi(dealId, type, amount, reason, disc=0, applicant){
  const id=nextId();
  const ap=applicant||state.role;
  let nominal=ringiRoute(type, amount, disc);
  /* 自己承認禁止: 拠点長自身の申請は管理部へ */
  if(ap===nominal && nominal==='leader') nominal='kanri';
  if(ap===nominal && nominal==='kanri'){ /* 管理部自身は拠点長に一次（モックではleaderへ） */ nominal='leader'; }
  const own=effectiveApprover(nominal);
  const proxyNote=own!==nominal?`（${PEOPLE[nominal]} 不在のため代理: ${PEOPLE[own]}）`:'';
  const byNote=ap!==state.role?`起票: ${meShort()}（申請者: ${PEOPLE[ap]}）`:`起票: ${meShort()}`;
  insertIssue({id, ref:nextRef('ringi'), repo:'ringi', kind:'ringi', parent:dealId, title:`${type}の稟議`, status:'承認待ち', open:true, own, by:state.role, applicant:ap, approver:own, nominalApprover:nominal,
    amount:amount?yen(amount):undefined,
    body:{'案件':`${byId(dealId).ref} ${byId(dealId).title}`,'種類':type,'金額':amount?yen(amount):'—','申請者':PEOPLE[ap],'起票者':meShort(),'用途':'決裁の識別。判断理由はタイムラインへ。'},
    tl:[ev('cm', meShort(), '# 起票', `${reason||'（理由未記入）'}${ap!==state.role?`\n（代理起票: 申請者 ${PEOPLE[ap]}）`:''}`), ev('sys','system',`${PEOPLE[own]} のキューへ${proxyNote}（種類と金額で自動判定）・${byNote}`)]});
  notify(own, `承認依頼: ${type}の稟議（${byId(dealId).ref}）${proxyNote}`, id);
  if(ap!==state.role) notify(ap, `代理で起票されました: ${type}の稟議（${byId(dealId).ref}）`, id);
  return byId(id);
}

function fieldHtml(f, pre){
  const val=k=>pre[k]!==undefined?pre[k]:'';
  const lab=`<label>${f.l}${f.req?'<span class="req">*</span>':''}</label>`;
  if(f.t==='line'){
    const d=f.def||['','',''];
    return `<div class="full">${lab}<div class="line">
      <input name="${f.k}n" value="${pre[f.k+'n']??d[0]}" placeholder="品目"><input name="${f.k}q" type="number" value="${pre[f.k+'q']??d[1]}" placeholder="数量"><input name="${f.k}p" type="number" value="${pre[f.k+'p']??d[2]}" placeholder="単価"></div></div>`;
  }
  const v=val(f.k)!==''?val(f.k):(f.k==='applicant'?state.role:(f.def||''));
  let input;
  if(f.t==='select') input=`<select name="${f.k}">${f.opts().map(([o,l])=>`<option value="${o}" ${String(o)===String(v)?'selected':''}>${l}</option>`).join('')}</select>`;
  else if(f.t==='textarea') input=`<textarea name="${f.k}">${v}</textarea>`;
  else input=`<input name="${f.k}" ${f.t==='number'?'type="number"':''} value="${v}">`;
  return `<div class="${f.full?'full':''}">${lab}${input}</div>`;
}
function renderFormLegacy(){
  const key=state.formKey;

    $('main').innerHTML=`<div class="pad"><button type="button" class="m-back" id="fmBack">← 管理一覧</button>
      <h2 class="page">新しく登録する</h2><p class="quiet">台帳に「行を足す」入口。何を登録するかを選びます。</p>
      <div class="table-wrap"><table class="ledger"><thead><tr><th style="width:30%">登録するもの</th><th>ASISでは</th></tr></thead><tbody>${rows}</tbody></table></div></div>`;
    $('fmBack').onclick=()=>go('mgmt',{mgmt:null});
    $('main').querySelectorAll('[data-fk]').forEach(b=>b.onclick=()=>go('form',{form:b.dataset.fk}));
    return;
  }
  const f=FORMS[key], pre=state.formPre||{}, done=state.formDone;
  $('main').innerHTML=`<div class="pad">
    <button type="button" class="m-back" id="fmBack">← 管理一覧</button>
    <h2 class="page">${f.title}</h2>
    ${whyHtml(f,'static')}
    ${done?`<div class="note" style="max-width:760px">✓ ${done.msg}</div>
      <div class="actions"><button class="bp" type="button" id="fmOpen">${done.openLabel}</button><button class="bg" type="button" id="fmAgain">続けて登録</button></div>`
    :`<form id="fm" class="form-grid" onsubmit="return false">${f.fields.map(x=>fieldHtml(x,pre)).join('')}</form>
      <div class="form-prev" id="fmPrev"></div>
      <div class="actions"><button class="bp" type="button" id="fmSubmit">${f.submitLabel}</button><button class="bg" type="button" id="fmCancel">キャンセル</button></div>`}
  </div>`;
  $('fmBack').onclick=()=>go('mgmt',{mgmt:null});
  if(done){
    $('fmOpen').onclick=()=>{ state.formDone=null; done.open(); };
    $('fmAgain').onclick=()=>go('form',{form:key});
    return;
  }
  const vals=()=>{ const o={}; $('fm').querySelectorAll('[name]').forEach(el=>o[el.name]=el.value); return o; };
  const upd=()=>{ $('fmPrev').innerHTML=f.preview?f.preview(vals()):''; };
  $('fm').addEventListener('input',upd); $('fm').addEventListener('change',upd); upd();
  $('fmCancel').onclick=()=>go('mgmt',{mgmt:null});
  $('fmSubmit').onclick=()=>{
    const res=f.submit(vals());

}

/* ================= 操作の流れ: 入口・ポップアップ・下書き・自分の申請 ================= */
const DRAFTS=[];
const REQ_FORMS=['ringi','buy','quote','expense','safety'];
issues.forEach(i=>{ if(['ringi','buy'].includes(i.kind) && !i.by){ i.by='sales'; i.approver=i.own; } });
function rootOf(it){ let x=it; while(x&&x.parent) x=byId(x.parent); return x; }
function nowHM(){ const d=new Date(); return `9/25 ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`; }
function formTitleOf(key, v){
  const f=FORMS[key]; const d=v&&v.deal&&byId(v.deal);
  if(key==='ringi') return `${v.type||'稟議'}の稟議${d?`（${d.title}）`:''}`;
  if(key==='buy') return `購買申請${v.sku?`: ${itemOf(v.sku).name}`:''}${d?`（${d.title}）`:''}`;
  if(key==='quote') return `見積${d?`（${d.title}）`:''}`;
  if(key==='cust') return `顧客登録: ${v.name||'（名前未入力）'}`;
  if(key==='prop') return `物件登録: ${v.name||'（名前未入力）'}`;
  return f?f.title:key;
}
function formBodyHtml(key, pre, mode){
  const f=FORMS[key];
  return `<form class="form-grid" data-fm onsubmit="return false">${f.fields.map(x=>fieldHtml(x,pre)).join('')}
      <div class="full"><label>添付（見積書・写真など）</label><input type="file" name="__file" multiple></div></form>
    <div class="form-prev" data-fprev></div>
    <div class="actions">
      <button class="bp" type="button" data-fsubmit>${f.submitLabel}</button>
      <button class="bg" type="button" data-fdraft>下書き保存</button>
      <button class="bg" type="button" data-fcancel>${mode==='modal'?'閉じる':'キャンセル'}</button>
    </div>`;
}
/* ctx: {draftId, editId} / hooks: {done(res), cancel(dirty, vals), drafted(msg)} */
function bindForm(root, key, ctx, hooks){
  const f=FORMS[key];
  const vals=()=>{ const o={}; root.querySelectorAll('[data-fm] [name]').forEach(el=>{ if(el.name==='__file') o.__files=[...el.files].map(x=>x.name).join('、'); else o[el.name]=el.value; }); return o; };
  const initial=JSON.stringify(vals());
  const upd=()=>{ const p=root.querySelector('[data-fprev]'); if(p) p.innerHTML=(f.preview?f.preview(vals(),ctx):'')+dupWarn(key,vals(),ctx); };
  const fm=root.querySelector('[data-fm]');
  fm.addEventListener('input',upd); fm.addEventListener('change',upd); upd();
  root.querySelector('[data-fsubmit]').onclick=()=>{
    const v=vals(); const res=(ctx&&ctx.editRec&&f.resubmit)?f.resubmit(v, ctx.editRec):f.submit(v, ctx||{});
    if(res.err){ root.querySelector('[data-fprev]').innerHTML=`<div class="note warn">${res.err}</div>`; return; }
    if(ctx&&ctx.draftId){ const i=DRAFTS.findIndex(d=>d.id===ctx.draftId); if(i>=0) DRAFTS.splice(i,1); }
    if(v.__files) res.msg+=` 添付: ${v.__files}`;
    hooks.done(res);
  };
  root.querySelector('[data-fdraft]').onclick=()=>{
    const v=vals(); saveDraft(key, v, ctx);
    hooks.drafted(`下書きに保存しました（${nowHM()}）。ヘッダ「自分の申請」→ 下書き から再開できます。`);
  };
  root.querySelector('[data-fcancel]').onclick=()=>hooks.cancel(JSON.stringify(vals())!==initial, vals());
}
function saveDraft(key, v, ctx){
  let d=ctx&&ctx.draftId?DRAFTS.find(x=>x.id===ctx.draftId):null;
  if(!d){ d={id:'dr'+(DRAFTS.length+1)+'-'+SEQ.n++, form:key, by:state.role}; DRAFTS.unshift(d); if(ctx) ctx.draftId=d.id; }
  d.vals=v; d.title=formTitleOf(key,v); d.saved=nowHM();
  return d;
}
function dupWarn(key, v, ctx){
  if(key!=='ringi' || !v.deal || (ctx&&ctx.editId)) return '';
  const same=issues.filter(i=>i.kind==='ringi' && rootOf(i)&&rootOf(i).id===v.deal && i.status==='承認待ち' && (i.body&&i.body['種類']===v.type || i.title.startsWith(v.type)));
  return same.length?`<div class="note warn">同じ案件に申請中の「${v.type}」稟議があります: ${same.map(s=>s.ref).join('、')}（二重申請に注意）</div>`:'';
}

/* ---- ポップアップ ---- */
function ensureModal(){
  if($('modal')) return;
  const m=document.createElement('div'); m.id='modal'; m.className='modal';
  m.innerHTML='<div class="modal-box" id="modalBox" role="dialog" aria-modal="true"></div>';
  document.body.appendChild(m);
}
function openFormModal(key, pre, ctx){
  ensureModal();
  const f=FORMS[key]; ctx=ctx||{};
  const box=$('modalBox');
  const head=`<div class="modal-h"><h3>${ctx.editId?'修正して再申請: ':''}${f.title}</h3><button class="x" type="button" data-mclose aria-label="閉じる">×</button></div>
    <p class="quiet" style="margin:0 0 10px">${ctx.from?`${ctx.from} から開いています（閉じると元の画面に戻ります）。`:''}主に使う人: ${f.who}</p>`;
  box.innerHTML=head+formBodyHtml(key, pre||{}, 'modal')+'<div data-mconfirm></div>';
  $('modal').classList.add('open');
  const close=()=>{ $('modal').classList.remove('open'); box.innerHTML=''; render(); };
  const doneView=(msg, openLabel, open)=>{
    box.innerHTML=`<div class="modal-h"><h3>${f.title}</h3><button class="x" type="button" data-mclose>×</button></div>
      <div class="note">✓ ${msg}</div>
      <div class="actions">${open?`<button class="bp" type="button" data-mopen>${openLabel}</button>`:''}<button class="bg" type="button" data-mmy>自分の申請を見る</button><button class="bg" type="button" data-mclose2>閉じる</button></div>`;
    box.querySelector('[data-mclose]').onclick=close; box.querySelector('[data-mclose2]').onclick=close;
    box.querySelector('[data-mmy]').onclick=()=>{ $('modal').classList.remove('open'); box.innerHTML=''; go('myreq'); };
    const o=box.querySelector('[data-mopen]'); if(o) o.onclick=()=>{ $('modal').classList.remove('open'); box.innerHTML=''; open(); };
  };
  const askClose=(dirty, vals)=>{
    if(!dirty){ close(); return; }
    box.querySelector('[data-mconfirm]').innerHTML=`<div class="note warn">入力した内容があります。
      <div class="actions" style="margin:8px 0 0"><button class="bp" type="button" data-cs>下書きに保存して閉じる</button><button class="bd" type="button" data-cx>破棄して閉じる</button><button class="bg" type="button" data-cb>入力に戻る</button></div></div>`;
    box.querySelector('[data-cs]').onclick=()=>{ saveDraft(key, vals, ctx); close(); };
    box.querySelector('[data-cx]').onclick=close;
    box.querySelector('[data-cb]').onclick=()=>{ box.querySelector('[data-mconfirm]').innerHTML=''; };
  };
  bindForm(box, key, ctx, {
    done:res=>doneView(res.msg, res.openLabel, res.open),
    drafted:msg=>doneView(msg),
    cancel:askClose,
  });
  box.querySelector('[data-mclose]').onclick=()=>box.querySelector('[data-fcancel]').click();
}
function openResubmit(it){
  const key=it.formKey||(it.kind==='buy'?'buy':'ringi');
  const root=rootOf(it);
  const pre=it.formVals?Object.assign({},it.formVals):{deal:root&&root.id, type:(it.body&&it.body['種類'])||it.title.replace(/の稟議$|（.*）/g,'').replace('起案',''), amount:String(it.amount||'').replace(/[^\d]/g,''), reason:''};
  openFormModal(key, pre, {editId:it.id, from:`${it.ref} の差戻し`});
}

/* ---- 専用ページ（管理 → 登録） ---- */
function renderForm(){
  const key=state.formKey;
  if(!key || !FORMS[key]){ renderFormLegacy(); return; }
  const f=FORMS[key], done=state.formDone;
  const ctx=state.formCtx||(state.formCtx={});
  $('main').innerHTML=`<div class="pad">
    <button type="button" class="m-back" id="fmBack">← 管理一覧</button>
    <h2 class="page">${f.title}</h2>
    ${whyHtml(f,'static')}
    ${done?`<div class="note" style="max-width:760px">✓ ${done.msg}</div>
      <div class="actions">${done.open?`<button class="bp" type="button" id="fmOpen">${done.openLabel}</button>`:''}<button class="bg" type="button" id="fmMy">自分の申請を見る</button><button class="bg" type="button" id="fmAgain">続けて登録</button></div>`
      : `<div id="fmRoot">${formBodyHtml(key, state.formPre||{}, 'page')}<div data-mconfirm></div></div>`}
  </div>`;
  $('fmBack').onclick=()=>go('mgmt',{mgmt:null});
  if(done){
    const o=$('fmOpen'); if(o) o.onclick=()=>{ state.formDone=null; done.open(); };
    $('fmMy').onclick=()=>go('myreq');
    $('fmAgain').onclick=()=>go('form',{form:key});
    return;
  }
  const root=$('fmRoot');
  bindForm(root, key, ctx, {
    done:res=>{ state.formDone=res; state.formPre=null; state.formCtx=null; render(); },
    drafted:msg=>{ state.formDone={msg}; state.formCtx=null; render(); },
    cancel:(dirty, vals)=>{
      if(!dirty){ go('mgmt',{mgmt:null}); return; }
      root.querySelector('[data-mconfirm]').innerHTML=`<div class="note warn">入力した内容があります。
        <div class="actions" style="margin:8px 0 0"><button class="bp" type="button" data-cs>下書きに保存して戻る</button><button class="bd" type="button" data-cx>破棄して戻る</button></div></div>`;
      root.querySelector('[data-cs]').onclick=()=>{ saveDraft(key, vals, ctx); go('mgmt',{mgmt:null}); };
      root.querySelector('[data-cx]').onclick=()=>go('mgmt',{mgmt:null});
    },
  });
}

/* ---- 詳細パネル: 文脈から起票・承認ルート・書類 ---- */
function panelExtras(it){
  const root=rootOf(it); let h='';
  if(root && root.kind==='deal' && root.open && state.role!=='koji'){
    const btns=[['ringi','稟議を起票'],['buy','購買申請'],['quote','見積を作成']].map(([k,l])=>`<button type="button" class="sp-act" data-cform="${k}">＋ ${l}</button>`).join('');
    h+=`<div class="ctx-new"><span>この案件（${root.ref}）で:</span>${btns}</div>`;
  }
  if(['ringi','buy'].includes(it.kind)){
    const by=it.by||'sales', ap=it.approver||it.own, applicant=it.applicant||by;
    const st=it.status;
    const s1='done', s2=st==='Done'?'done':st==='差戻し'?'back':st==='取り下げ'?'skip':'cur';
    const nom=it.nominalApprover;
    h+=`<div class="route"><b>${it.kind==='ringi'?'承認ルート':'処理の流れ'}</b>
      <span class="rs ${s1}">起票 ${PEOPLE[by]}${applicant!==by?`（申請者 ${PEOPLE[applicant]}）`:''}</span><i>→</i>
      <span class="rs ${s2}">${it.kind==='ringi'?'承認':'手配'} ${PEOPLE[ap]}${nom&&nom!==ap?`（${PEOPLE[nom]} の代理）`:''}${s2==='cur'?'（いまここ）':s2==='back'?'（差戻し）':s2==='skip'?'（取り下げ）':''}</span><i>→</i>
      <span class="rs ${st==='Done'?'done':''}">${it.kind==='ringi'?'案件に反映':'納期登録'}</span></div>`;
  }
  const docs=docsOf(it);
  if(docs.length) h+=`<div class="docs"><b>書類</b>${docs.map((d,i)=>`<button type="button" class="linkbtn" data-doc="${i}">📄 ${d.name}</button>`).join('')}</div>`;
  return h;

function bindPanelExtras(root, it){
  const r=rootOf(it);
  root.querySelectorAll('[data-cform]').forEach(b=>b.onclick=()=>openFormModal(b.dataset.cform, {deal:r.id}, {from:`${r.ref} の詳細パネル`}));

function docsOf(it){

function openDoc(d, it){

  const box=$('modalBox');

    ? `<tr><td>調査・点検作業</td><td>1</td><td>120,000</td></tr><tr><td>施工作業一式</td><td>1</td><td>1,380,000</td></tr><tr><td colspan="2">値引</td><td>−180,000</td></tr>`

    ? `<tr><td>上記正に領収いたしました</td><td>1</td><td>${(d.amount||0).toLocaleString()}</td></tr>`

    ? `<tr><td>ご注文の件、確かに承りました</td><td>1</td><td>${(d.amount||0).toLocaleString()}</td></tr>`

    : `<tr><td colspan="3">${d.kind==='warranty'?'保証内容・保証期間・免責事項':'作業内容・所見・写真（3枚）・申し送り'}</td></tr>`;
  const who=d.cust||(c?c.name:'お客さま');
  const sendHist=d.sends.length?`<ul class="chg-hist">${d.sends.map(s=>`<li>${s.at} ${s.who} · ${s.how} → ${s.to}</li>`).join('')}</ul>`:'<p class="quiet">まだ送付履歴はありません。</p>';
  box.innerHTML=`<div class="modal-h"><h3>📄 ${d.name}</h3><button class="x" type="button" data-mclose>×</button></div>
    <div class="paper"><div class="paper-h"><b>${titleMap[d.kind]||'書類'}</b><span>株式会社サニックス</span></div>

      ${d.kind!=='cover'?`<button class="bg" type="button" data-cover>送付状を付ける</button>`:''}
      <button class="bg" type="button" data-mclose2>閉じる</button>

  issues.filter(i=>i.by===me && ['ringi','buy','task'].includes(i.kind) && (i.kind!=='task'||i.title.startsWith('見積 '))).forEach(i=>{

$('app').addEventListener('wheel', e=>{
  const main=$('main'); if(!main) return;
  const oy=getComputedStyle(main).overflowY;
  if(oy!=='auto' && oy!=='scroll') return;
  if(main.scrollHeight<=main.clientHeight+1) return;
  let el=e.target;
  while(el && el!==main && el!==$('app')){
    const s=getComputedStyle(el);
    if((s.overflowY==='auto'||s.overflowY==='scroll') && el.scrollHeight>el.clientHeight+1) return;
    el=el.parentElement;
  }
  if(main.contains(e.target)) return;
  e.preventDefault();
  main.scrollTop+=e.deltaY;
},{passive:false});
