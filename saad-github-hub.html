<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SAAD Hub — GitHub構成にSAADを載せる（連携・使用感モック）</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+JP:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#0c1222;--muted:#5b6b82;--line:#c9d2e0;--panel:#f7f9fc;
  --teal:#0d7377;--teal-deep:#095456;--amber:#c47b16;--rose:#b42318;
  --open:#1a7f4b;--done:#5b4d9a;--font:"IBM Plex Sans JP",sans-serif;
  --shadow:0 18px 50px rgba(12,18,34,.12);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:var(--font);color:var(--ink);background:radial-gradient(1200px 600px at 10% -10%,#d7e8e8 0%,transparent 55%),linear-gradient(165deg,#e8edf4,#d5dde8);overflow:hidden}
body.is-mobile{height:auto;min-height:100%;overflow:auto}
button,select,input,textarea{font:inherit}button{cursor:pointer}

/* シェル: デモ帯は固定、Hub本体が残り高さを使い切る */
.shell{max-width:1280px;margin:0 auto;padding:10px 12px 12px;height:100%;display:flex;flex-direction:column;gap:8px;min-height:0}
body.is-mobile .shell{height:auto;min-height:100%}
.banner{flex:none;display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:8px 12px;background:rgba(247,249,252,.92);border:1px solid var(--line);border-radius:12px}
.banner h1{margin:0;font-size:15px}.banner .sub{margin:0;font-size:11.5px;color:var(--muted);flex:1;min-width:160px}
.roles{display:flex;flex-wrap:wrap;gap:5px}
.role{border:1px solid var(--line);background:#fff;border-radius:999px;padding:5px 10px;font-size:11.5px;color:var(--muted)}
.role[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:#fff;font-weight:600}
.role .b{display:inline-block;min-width:14px;margin-left:4px;border-radius:999px;background:var(--rose);color:#fff;font-size:9px;padding:0 4px;text-align:center}
.hint{flex:none;margin:0;padding:7px 12px;border-left:4px solid var(--teal);background:rgba(255,255,255,.78);border-radius:0 8px 8px 0;font-size:12.5px;line-height:1.55}
.hint strong{color:var(--teal-deep)}
.hint code{font-family:ui-monospace,Menlo,monospace;font-size:11px;background:#eef2f7;border-radius:4px;padding:0 4px}

/* Hub本体: ヘッダー固定 / mainだけが中でスクロール */
.app{position:relative;flex:1 1 auto;min-height:0;background:var(--panel);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);overflow:hidden;display:flex;flex-direction:column}
.gheader{flex:none;display:flex;align-items:center;gap:8px;padding:9px 12px;background:var(--ink);color:#e8eef7;flex-wrap:nowrap;min-width:0}
.brand{width:26px;height:26px;border-radius:6px;background:linear-gradient(135deg,#1aa6ab,#0a4f52);display:grid;place-items:center;font-size:10px;font-weight:700;flex:none}
.gnav{display:flex;gap:2px;margin-left:6px;flex:none;flex-wrap:nowrap}
.gnav button{border:0;background:transparent;color:#9fb0c9;font-size:12px;padding:5px 9px;border-radius:7px;white-space:nowrap}
.gnav button:hover{background:#243049;color:#dfe8f4}
.gnav button[aria-current="page"]{background:#243049;color:#fff;font-weight:600}
.search{flex:1;min-width:72px;max-width:220px;margin-left:auto;background:#243049;border:1px solid #31405c;border-radius:8px;padding:6px 9px;color:#c5d0e0;font-size:11.5px}
.iconbtn{border:0;background:#243049;color:#c5d0e0;border-radius:8px;padding:6px 10px;font-size:11.5px;position:relative;flex:none}
.iconbtn .b{position:absolute;top:-4px;right:-4px;min-width:15px;border-radius:999px;background:#f04438;color:#fff;font-size:9px;padding:1px 4px;text-align:center}
.avatar{width:26px;height:26px;border-radius:50%;background:#3a4d6d;display:grid;place-items:center;font-size:10px;font-weight:600;flex:none}
.subbar{flex:none;display:flex;gap:10px;align-items:center;flex-wrap:nowrap;padding:8px 14px;background:#fff;border-bottom:1px solid var(--line);min-width:0}
.crumb{font-size:12px;color:var(--muted);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.crumb b{color:var(--ink)}
.urlbox{margin-left:auto;font-family:ui-monospace,Menlo,monospace;font-size:10px;color:#8a97ab;background:#f4f7fb;border:1px solid var(--line);border-radius:6px;padding:3px 8px;max-width:min(340px,42%);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:none}
.main{flex:1;min-height:0;overflow-x:hidden;overflow-y:auto;background:#fff;position:relative;overscroll-behavior:contain;scrollbar-gutter:stable}
/* 台帳・マスタ一覧: 上固定＋下ペインでスクロール（main自体は止めない二重スクロールを防ぐ） */
.main:has(> .split),
.main:has(> .filterbar):has(> .table-wrap){display:flex;flex-direction:column;overflow:hidden}

/* notif */
.notif{position:absolute;right:12px;top:44px;width:320px;background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);z-index:30;display:none;max-height:380px;overflow:auto}
.notif.open{display:block}
.notif h4{margin:0;padding:10px 12px;font-size:12px;border-bottom:1px solid var(--line)}
.notif .n{display:block;width:100%;text-align:left;border:0;background:#fff;padding:10px 12px;border-bottom:1px solid #eef2f6;font-size:12px;cursor:pointer}
.notif .n:hover{background:#f3f8f8}
.notif .n small{display:block;color:var(--muted);margin-top:3px;font-family:ui-monospace,Menlo,monospace;font-size:10px}
.notif .empty{padding:14px 12px;font-size:12px;color:var(--muted)}

/* portal — GitHubダッシュボード型: 左=自分の道具箱 / 中央=仕事と共有 / 右=今日と導線（Primer調） */
.portal{display:grid;grid-template-columns:232px minmax(0,1fr) 260px;background:#fff;min-height:100%}
@media(max-width:960px){.portal{grid-template-columns:1fr}.db-main{order:1}.db-side{order:2}.db-rail{order:3}.db-side,.db-rail{border-right:0;border-left:0;border-top:1px solid var(--line)}}
.db-side{padding:16px 14px;border-right:1px solid var(--line);background:#fff}
.db-me{display:flex;align-items:center;gap:9px;margin-bottom:16px}
.db-me .av{width:32px;height:32px;border-radius:50%;background:linear-gradient(135deg,#3a4d6d,#1a2a44);color:#fff;display:grid;place-items:center;font-size:12px;font-weight:700;flex:none}
.db-me b{font-size:13.5px;display:block;line-height:1.25}
.db-me small{font-size:11px;color:var(--muted)}
.db-h{margin:0 0 4px;font-size:12px;font-weight:600;color:var(--ink);display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.db-h .more{border:0;background:0;color:#0969da;font-size:11.5px;padding:0;font-weight:400}
.db-h .more:hover{text-decoration:underline}
.app-list{display:flex;flex-direction:column;margin:0 -6px 16px}
.app-row{display:flex;align-items:center;gap:8px;padding:5px 8px;border-radius:6px;border:0;background:0;text-align:left;font-size:13px;font-weight:600;color:var(--ink);width:calc(100% + 0px)}
.app-row:hover{background:#f6f8fa}
.app-row .sw{width:16px;height:16px;border-radius:4px;flex:none}
.app-row .cnt{margin-left:auto;font-size:10.5px;font-weight:600;color:var(--muted);background:#eff1f3;border-radius:999px;padding:1px 7px}
.sc-list{display:flex;flex-direction:column;margin:0 -6px}
.sc-row{display:flex;align-items:center;gap:8px;padding:4px 8px;border-radius:6px;font-size:12.5px;color:var(--ink);border:0;background:0;text-align:left}
.sc-row:hover{background:#f6f8fa;color:#0969da}
.sc-row .ic{width:12px;height:12px;border-radius:3px;background:#d8dee4;flex:none}
.sc-row:hover .ic{background:#0969da}
.sc-row .ext{margin-left:auto;font-size:9.5px;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:0 5px}
.db-main{padding:14px 18px;min-width:0}
.db-sec{margin-bottom:16px}
.sec-h{display:flex;align-items:center;gap:8px;margin:0 0 6px}
.sec-h h3{margin:0;font-size:13.5px;font-weight:600}
.sec-h .cnt{font-size:11px;background:#eff1f3;border-radius:999px;padding:0 7px;color:var(--muted);font-weight:600;line-height:18px}
.sec-h .more{margin-left:auto;border:0;background:0;color:#0969da;font-size:12px;padding:0}
.sec-h .more:hover{text-decoration:underline}
.wk-list,.feed-list{border:1px solid #d0d7de;border-radius:6px;overflow:hidden;background:#fff}
/* 1行に詰める: 左=種別とタイトル（省略）、右=参照・状態・待ち先 */
.wk-row,.feed-row{display:grid;align-items:center;column-gap:10px;width:100%;text-align:left;border:0;background:#fff;padding:6px 12px;border-bottom:1px solid #eef1f4;font-size:12.5px;line-height:20px;min-width:0}
.wk-row{grid-template-columns:10px minmax(0,1fr) auto auto minmax(0,180px)}
.feed-row{grid-template-columns:8px 64px minmax(0,1fr) 88px 40px}
.wk-row:last-child,.feed-row:last-child{border-bottom:0}
.wk-row:hover,.feed-row:hover{background:#f6f8fa}
.wk-row .st{width:8px;height:8px;border-radius:50%;border:2px solid var(--open)}
.wk-row .st.warn{border-color:#bf8700;background:#fff8c5}
.wk-row .st.back{border-color:#cf222e;background:#ffebe9}
.wk-row .t,.feed-row .t{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600;color:var(--ink)}
.wk-row .t .kind{margin-right:5px}
.wk-row .ref{white-space:nowrap}
.wk-row .wt{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:11.5px;color:var(--muted);text-align:right}
.wk-sub{padding:4px 12px;font-size:11px;font-weight:600;color:var(--muted);background:#f6f8fa;border-bottom:1px solid #eef1f4}
.wk-empty{padding:8px 12px;font-size:12px;color:var(--muted)}
.feed-row .ud{width:8px;height:8px;border-radius:50%;background:#0969da}
.feed-row .ud.read{background:transparent}
.feed-row .fr{font-size:11.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.feed-row .dt{font-size:11.5px;color:var(--muted);text-align:right;font-variant-numeric:tabular-nums}
.feed-row .t.read{font-weight:400;color:#424a53}
.fl{display:inline-block;font-size:10px;font-weight:700;border-radius:999px;padding:0 7px;line-height:18px;text-align:center;white-space:nowrap}
@media(max-width:1100px){.wk-row{grid-template-columns:10px minmax(0,1fr) auto auto}.wk-row .wt{display:none}.feed-row{grid-template-columns:8px 64px minmax(0,1fr) 40px}.feed-row .fr{display:none}}
.fl.info{background:#ddf4ff;color:#0969da}
.fl.urgent{background:#ffebe9;color:#cf222e}
.fl.know{background:#dafbe1;color:#1a7f37}
.db-rail{padding:16px 14px;border-left:1px solid var(--line);background:#fff}
.rail-cta{display:block;width:100%;border:0;border-radius:6px;background:var(--teal);color:#fff;font-weight:600;font-size:12.5px;padding:8px 10px;margin-bottom:16px;text-align:center}
.rail-cta:hover{background:var(--teal-deep)}
.rail-sec{margin-bottom:18px}
.today-list{margin:2px 0 0}
.today-row{display:flex;gap:8px;font-size:12px;padding:5px 0;border-bottom:1px dashed #e6ebf1;line-height:1.4}
.today-row:last-child{border-bottom:0}
.today-row .tm{font-family:ui-monospace,Menlo,monospace;font-size:10.5px;color:var(--muted);flex:none;width:36px;padding-top:1px}
.tlm{list-style:none;margin:4px 0 0;padding:0;position:relative}
.tlm::before{content:"";position:absolute;left:5px;top:4px;bottom:4px;width:2px;background:#eef1f4}
.tlm li{position:relative;padding:0 0 10px 18px;font-size:11.5px;color:var(--muted);line-height:1.45}
.tlm li:last-child{padding-bottom:0}
.tlm li::before{content:"";position:absolute;left:1px;top:3px;width:6px;height:6px;border-radius:50%;background:#fff;border:2px solid #b6c3d2}
.tlm li b{color:var(--ink);font-weight:600;font-family:ui-monospace,Menlo,monospace;font-size:10.5px}
.quiet{margin:0 0 10px;color:var(--muted);font-size:12px;line-height:1.5}

/* wip / knowledge */
.wip-box{max-width:640px;margin:24px auto;padding:28px 28px 24px;border:1px solid var(--line);border-radius:14px;background:linear-gradient(180deg,#fff,#f7fafb)}
.wip-badge{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.04em;color:#9a6700;background:#fff8c5;border:1px solid #d4a72c;border-radius:999px;padding:3px 10px;margin-bottom:12px}
.wip-box h2{margin:0 0 8px;font-size:20px}
.wip-box .wip-kind{margin:0 0 14px;font-size:12.5px;color:var(--muted)}
.wip-meta{display:grid;gap:8px;margin:0 0 16px;padding:12px 14px;background:#f4f7fb;border:1px solid var(--line);border-radius:10px;font-size:12.5px}
.wip-meta div{display:flex;gap:10px;align-items:baseline}
.wip-meta span{flex:none;width:88px;color:var(--muted);font-size:11.5px}
.wip-meta code{font-family:ui-monospace,Menlo,monospace;font-size:11px;word-break:break-all}
.wip-box .actions{margin-top:8px}
.know-list{display:flex;flex-direction:column;gap:8px;margin-top:10px}
.know-card{display:block;width:100%;text-align:left;border:1px solid var(--line);border-radius:10px;background:#fff;padding:12px 14px}
.know-card:hover{border-color:#0969da;background:#f6f8fa}
.know-card b{display:block;font-size:13.5px;margin-bottom:4px}
.know-card small{display:block;color:var(--muted);font-size:11.5px;line-height:1.45}
.know-card .ktag{display:inline-block;font-size:10px;font-weight:700;border-radius:999px;padding:1px 8px;margin-right:6px;background:#ddf4ff;color:#0969da}
.today-row.btnish{width:100%;border:0;background:transparent;text-align:left;cursor:pointer;font:inherit;color:inherit}
.today-row.btnish:hover{background:#f6f8fa;border-radius:6px}
.tlm li button{border:0;background:0;padding:0;font:inherit;color:inherit;text-align:left;cursor:pointer}
.tlm li button:hover b{color:#0969da;text-decoration:underline}

/* spaces — アプリ表 */
.sp-wrap{padding:16px 20px 28px}
.sp-head{display:flex;align-items:center;gap:12px;margin-bottom:12px;flex-wrap:wrap}
.sp-head h2{margin:0;font-size:16px;font-weight:600}
.sp-head .sum{display:flex;gap:14px;font-size:12px;color:var(--muted)}
.sp-head .sum b{color:var(--ink);font-weight:600;font-variant-numeric:tabular-nums}
.sp-tools{display:flex;gap:8px;align-items:center;margin:0 0 8px;flex-wrap:wrap}
.sp-tools input{flex:1;min-width:200px;max-width:320px;border:1px solid var(--line);border-radius:6px;padding:5px 10px;font-size:12.5px;background:#fff}
.sp-tools input:focus{outline:2px solid var(--teal);outline-offset:-1px}
.sp-tbl{width:100%;border-collapse:collapse;font-size:12.5px;background:#fff;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.sp-tbl th{text-align:left;font-size:11px;font-weight:600;color:var(--muted);padding:7px 12px;background:#f8fafc;border-bottom:1px solid var(--line);white-space:nowrap}
.sp-tbl td{padding:7px 12px;border-bottom:1px solid #edf1f5;vertical-align:middle}
.sp-tbl tr:last-child td{border-bottom:0}
.sp-tbl tbody tr:hover td{background:#f6fafa}
.sp-app{display:flex;align-items:center;gap:8px;border:0;background:0;padding:0;text-align:left;min-width:0;max-width:100%}
.sp-app i{width:10px;height:10px;border-radius:3px;flex:none}
.sp-app b{font-weight:600;color:var(--ink);white-space:nowrap}
.sp-app:hover b{color:var(--teal-deep);text-decoration:underline}
.sp-app small{font-size:11.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.sp-tbl .num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.sp-tbl .num.hot{color:#8a5a10;font-weight:700}
.sp-tbl .num.zero{color:#b0bac7}
.sp-tbl .who{font-size:11.5px;color:var(--muted);white-space:nowrap}
.sp-tbl .acts{display:flex;gap:4px;flex-wrap:wrap}
.sp-act{border:1px solid var(--line);background:#fff;border-radius:6px;padding:1px 8px;font-size:11.5px;line-height:20px;color:var(--ink);white-space:nowrap}
.sp-act:hover{border-color:var(--teal);color:var(--teal-deep)}
.sp-st{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;white-space:nowrap}
.sp-st i{width:7px;height:7px;border-radius:50%}
.sp-st.live i{background:var(--open)}
.sp-st.next i{background:#9aa8bc}
.sp-st.wip{color:#8a5a10}.sp-st.wip i{background:#d4a72c}
.sp-tbl tr.mine td:first-child{box-shadow:inset 3px 0 0 var(--teal)}
.sp-empty{padding:18px 12px;text-align:center;font-size:12.5px;color:var(--muted)}
@media(max-width:1100px){.sp-tbl .col-who{display:none}}

.pad{padding:14px 16px}
h2.page{margin:0 0 6px;font-size:17px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
@media(max-width:800px){.grid3{grid-template-columns:1fr}}
.card{text-align:left;border:1px solid var(--line);border-radius:12px;padding:14px;background:#fff}
.card:hover{border-color:var(--teal)}
.card .tag{display:inline-block;font-size:10px;font-weight:700;color:var(--teal-deep);background:#e4f3f3;border-radius:4px;padding:2px 6px;margin-bottom:6px}
.card.old .tag{color:#6b5b3a;background:#f3ead8}
.card h3{margin:0 0 4px;font-size:14px}.card p{margin:0;font-size:12px;color:var(--muted);line-height:1.45}

/* board / repo: 上のView・フィルタは固定、下のリスト｜詳細が独立スクロール */
.views{flex:none;display:flex;gap:2px;overflow-x:auto;padding:0 12px;background:#fff;border-bottom:1px solid var(--line)}
.views button{border:0;background:transparent;padding:9px 11px;font-size:12px;color:var(--muted);border-bottom:2px solid transparent;white-space:nowrap}
.views button[aria-selected="true"]{color:var(--ink);font-weight:600;border-bottom-color:var(--teal)}
.views .newv{color:#9aa8bc}
.filterbar{flex:none;display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:8px 14px;background:#f8fafc;border-bottom:1px solid var(--line)}
.ftoken{font-family:ui-monospace,Menlo,monospace;font-size:11px;padding:4px 8px;border-radius:6px;background:#eef2f7;border:1px solid var(--line);color:var(--ink)}
.count{margin-left:auto;font-size:11.5px;color:var(--muted)}
/* Primer風: View切替（セグメント）＋ フィルタの軽いラベル */
.seg{display:inline-flex;align-items:center;padding:3px;gap:1px;background:#eff1f3;border:1px solid #d0d7de;border-radius:6px}
.seg button{border:0;background:transparent;margin:0;padding:3px 11px;font-size:12px;font-weight:500;color:#656d76;border-radius:4px;line-height:20px;white-space:nowrap}
.seg button:hover{color:var(--ink)}
.seg button[aria-selected="true"]{background:#fff;color:var(--ink);font-weight:600;box-shadow:0 1px 0 rgba(31,35,40,.04), inset 0 0 0 1px rgba(208,215,222,.2)}
.chip{display:inline-flex;align-items:center;font-size:11px;font-weight:500;padding:2px 8px;border-radius:999px;background:#eff1f3;color:#656d76;border:1px solid transparent;line-height:18px}
.gate-banner{flex:none;margin:0;padding:8px 14px;font-size:12px;background:#fff4e8;border-bottom:1px solid #f0d6a8;color:#6b4a12}
.gate-banner.ok{background:#e8f6ee;border-color:#b7e0c5;color:#1a7f4b}
.repo-banner{flex:none;margin:0;padding:8px 14px;font-size:12px;background:#eef2f7;border-bottom:1px solid var(--line);color:var(--muted)}

/* リスト｜詳細のワークスペース */
.split{flex:1;min-height:0;display:grid;grid-template-columns:1fr;overflow:hidden}
.has-panel .split{grid-template-columns:minmax(340px,46%) minmax(0,54%)}
@media(max-width:960px){.has-panel .split{grid-template-columns:1fr}.has-panel .list-pane{display:none}}
.list-pane{min-height:0;height:100%;display:flex;flex-direction:column;overflow:hidden;background:#fff}
.has-panel .list-pane{border-right:1px solid var(--line)}
.list-pane .filterbar{flex:none}
.table-wrap{min-height:0;overflow:auto;overscroll-behavior:contain}
/* 文書ページ（構成・使い方など）の表は全行展開。スクロールは #main 側だけ */
.pad .table-wrap{overflow:visible;height:auto;min-height:0;border:1px solid var(--line);border-radius:8px}
.list-pane > .table-wrap,
.split > .table-wrap{flex:1 1 auto}

<script>
/* ================= data ================= */
const PEOPLE = { sales:'星本', leader:'田中（拠点長）', kanri:'佐藤（管理部）', buy:'鈴木（購買）', koji:'山本（施工L）', jimu:'高橋（事務）' };
const ROLES = {

function custIssues(cid){
  const roots=issues.filter(i=>i.customer===cid);
  const all=new Set(roots.map(r=>r.id));
  issues.forEach(i=>{ let p=i.parent; while(p){ if(all.has(p)){ all.add(i.id); break;} const par=byId(p); p=par&&par.parent; } });
  return issues.filter(i=>all.has(i.id));
}
function propIssues(pid){
  const roots=issues.filter(i=>i.property===pid);
  const all=new Set(roots.map(r=>r.id));
  issues.forEach(i=>{ let p=i.parent; while(p){ if(all.has(p)){ all.add(i.id); break;} const par=byId(p); p=par&&par.parent; } });
  return issues.filter(i=>all.has(i.id));
}
function propStats(pid){
  const list=propIssues(pid);
  const deals=list.filter(i=>i.kind==='deal');
  const activeDeals=deals.filter(i=>i.open);
  const leads=list.filter(i=>i.kind==='lead'&&i.open);
  return {deals, activeDeals, leads, all:list};
}

/* ================= helpers ================= */
function $(id){return document.getElementById(id)}
function byId(id){return issues.find(i=>i.id===id)}
function kids(id){return issues.filter(i=>i.parent===id)}
function progressOf(it){ const k=kids(it.id); if(!k.length) return null; return [k.filter(x=>x.status==='Done').length, k.length]; }
function gateDone(){ return kids('841-gate').filter(i=>i.status!=='取り下げ').every(i=>i.status==='Done'); }
function kojiDone(){ return ['841-k1','841-k2'].every(id=>byId(id).status==='Done'); }
function allKidsDone(id){ return kids(id).every(i=>i.status==='Done' && (!kids(i.id).length || allKidsDone(i.id))); }
function pill(s){ const c = s==='承認待ち'?'wait': s==='In Progress'?'prog': s==='Done'?'done': (s==='Blocked'||s==='取り下げ')?'block': s==='差戻し'?'back':''; return `<span class="pill ${c}">${s}</span>`; }
function orgOf(it){
  let cur=it;
  while(cur && !cur.division){ cur = cur.parent ? byId(cur.parent) : null; }
  return cur ? {division:cur.division, branch:cur.branch} : {division:'—', branch:'—'};
}
function orgLabel(it, short=false){
  const o=orgOf(it);
  return short ? `${o.division}・${o.branch.replace('営業所','')}` : `${o.division} / ${o.branch}`;
}
function waitingOf(it){
  if(!it) return null;
  if(it.status==='取り下げ') return {t:'取り下げ済み（履歴として残る）', cls:'done'};
  if(!it.open) return {t:'Close済（完了・履歴）', cls:'done'};
  if(it.kind==='gate' && it.status!=='Done'){ const k=kids(it.id); return {t:`稟議・購買の完了待ち（残り ${k.filter(x=>x.status!=='Done').length}件）`, cls:''}; }
  if(it.status==='Done') return {t:'この行は完了。親の残り待ち', cls:'done'};
  if(it.status==='承認待ち') return {t:`${PEOPLE[it.own]} の承認待ち`, cls:''};
  if(it.status==='差戻し') return {t:`${PEOPLE.sales} の再申請待ち`, cls:'back'};
  if(it.status==='Blocked') return {t:'ゲート開通待ち（稟議・購買の完了）', cls:''};
  if(it.status==='In Progress') return {t:`${PEOPLE[it.own]} が対応中`, cls:'prog'};
  return {t:`${PEOPLE[it.own]} の着手待ち`, cls:''};
}
function notify(to, text, ref){ inbox[to].unshift({text, ref}); }
function addEvent(it, e){ it.tl.push(e); }

function recalc(){
  const gOpen = gateDone();
  ['841-p2','841-k1','841-k2'].forEach(id=>{
    const it=byId(id);
    if(!gOpen){ if(it.status!=='Done'){ it.status='Blocked'; it.blocked=true; } }
    else if(it.status==='Blocked'){ it.status='Todo'; it.blocked=false; }
  });
  const g=byId('841-gate'); g.status = gateDone() ? 'Done' : 'In Progress';
  const p2=byId('841-p2'); if(kojiDone()) p2.status='Done';
  const bill=byId('841-bill1');
  if(kojiDone() && bill.status==='Blocked'){ bill.status='Todo'; bill.blocked=false; }
  const p3=byId('841-p3'); if(kids('841-p3').every(i=>i.status==='Done')) p3.status='Done';
  const p1b=byId('2103-p1'); p1b.status = kids('2103-p1').every(i=>i.status==='Done') ? 'Done' : 'In Progress';
}

/* ================= actions (連携の核) ================= */
function act(kindA, id){
  const it=byId(id); const me=PEOPLE[state.role];
  if(kindA==='resubmitEdit'){ openResubmit(it); return; }
  if(kindA==='withdraw'){
    it.status='取り下げ'; it.open=false; it.blocked=false;
    addEvent(it, ev('sys', me, `${me} が取り下げ — 行は消さず履歴に残す`));
    notify(it.approver||it.own, `取り下げ: ${it.title}（${it.ref}）`, it.id);
    recalc(); render(); return;
  }
  if(kindA==='nudge'){
    addEvent(it, ev('sys', me, `${me} が ${PEOPLE[it.own]} に催促`));
    notify(it.own, `催促: ${it.title}（${it.ref}）`, it.id);
    render(); return;
  }
  const gateBefore=gateDone(); const kojiBefore=kojiDone();
  if(kindA==='approve'){
    it.status='Done';
    addEvent(it, ev('sys', me, `${me} が承認 — Status: 承認待ち → Done（Issueは Open のまま）`));
    notify('sales', `${it.ref}（${it.title}）が承認されました`, it.id);
  }
  if(kindA==='reject'){
    it.status='差戻し'; it.own='sales';
    addEvent(it, ev('cm', me, '# 差戻し', '条件を確認のうえ再申請してください。'));
    notify('sales', `${it.ref}（${it.title}）が差戻されました`, it.id);
  }
  if(kindA==='resubmit'){
    it.status='承認待ち'; it.own = (it.id==='841-r3') ? 'kanri' : 'leader';
    addEvent(it, ev('cm', me, '# 再申請', '条件を修正して再申請します。'));
    notify(it.own, `再申請: ${it.title}`, it.id);
  }
  if(kindA==='buyProg'){ it.status='In Progress'; addEvent(it, ev('sys', me, '手配中に更新')); }
  if(kindA==='buyDone'){
    it.status='Done'; it.eta='確定 9/26';
    addEvent(it, ev('sys', me, '発注済 — 納期 9/26 をフィールドに登録'));
    notify('sales', `buy#31 発注済（納期 9/26）`, it.id);
  }
  if(kindA==='taskDone'){
    it.status='Done';
    addEvent(it, ev('sys', me, '完了 — Status: Done'));
  }
  if(kindA==='billDone'){
    it.status='Done';
    addEvent(it, ev('sys', me, '請求書発行 — Status: Done'));
    notify('sales', 'billing#77 請求書を発行しました', it.id);
  }
  if(kindA==='closeDeal'){
    it.open=false; it.status='Done';
    addEvent(it, ev('sys', me, '全工程完了 — 案件を Close（紫）。作業メモの Close とは違い、これが唯一の Close。'));
    notify('sales', 'sfa#841 案件が完了（Close）しました', it.id);
  }
  recalc();
  if(!gateBefore && gateDone()){
    const g=byId('841-gate');
    addEvent(g, ev('sys','system','ゲート開通 — 4/4 Done。施工 koji#55 の Blocked を解除'));
    addEvent(byId('841-p2'), ev('sys','system','施工前ゲート開通により Blocked → Todo'));
    notify('koji','施工ロック解除 — 入場可能になりました','841-p2');
  }
  if(!kojiBefore && kojiDone()){
    addEvent(byId('841-bill1'), ev('sys','system','施工完了により Blocked → Todo（請求可能）'));
    notify('kanri','施工完了 — 請求書発行が可能になりました','841-bill1');
  }
  render();
}

function actionsFor(it){
  const r=state.role;
  if(it.kind==='ringi' && it.status==='承認待ち' && it.own===r) return [['approve','承認して Status=Done','bp'],['reject','差戻し','bd']];
  if(['ringi','buy'].includes(it.kind) && it.status==='差戻し' && it.by===r) return [['resubmitEdit','修正して再申請','bp'],['withdraw','取り下げ','bg']];
  if(['ringi','buy'].includes(it.kind) && ['承認待ち','Todo'].includes(it.status) && it.by===r && it.own!==r) return [['nudge','催促する','bg'],['withdraw','取り下げ','bg']];
  if(it.kind==='buy' && r==='buy' && it.status!=='Done') return [['buyProg','手配中','bg'],['buyDone','発注済にする','bp']];
  if(it.repo==='koji' && it.kind==='task' && r==='koji' && it.status==='Todo') return [['taskDone','完了にする','bp']];
  if(it.kind==='bill' && r==='kanri' && it.status==='Todo') return [['billDone','請求書発行 → Done','bp']];
  if(it.kind==='deal' && it.id==='841' && (r==='kanri'||r==='leader') && it.open && allKidsDone('841')) return [['closeDeal','案件を完了（Close）','bp']];
  return [];
}

function openShortcut(id){
  if(id==='know'){ go('knowledge'); return; }
  if(id==='keihi'){ openFormModal('expense',{},{from:'ポータルのショートカット'}); return; }
  if(id==='safety'){ go('mgmt',{mgmt:'safety'}); return; }
  if(id==='car'){ go('mgmt',{mgmt:'cars'}); return; }
  if(id==='cal'){ go('mgmt',{mgmt:'calendar'}); return; }
  goWip(id);
}

function renderKnowledge(){
  const cards=KNOWLEDGE.map((k,i)=>`<button type="button" class="know-card" data-ki="${i}">
    <span class="ktag">${k.tag}</span><b>${k.title}</b>
    <small>${k.blurb}</small>
  </button>`).join('');
  const feed=ANNOUNCEMENTS.map((a,i)=>`<button type="button" class="know-card" data-ai="${i}">
    <span class="ktag">${a.tag}</span><b>${a.title}</b>
    <small>${a.when}${a.wip?' · 本文は外部（開発中ページ）':a.go?` · 内部: ${a.go}`:''}</small>
  </button>`).join('');
  $('main').innerHTML=`<div class="pad">
    <button type="button" class="m-back" id="knowBack">← ポータル</button>
    <h2 class="page">ナレッジ・通達アーカイブ</h2>
    <p class="quiet">Hub内で開けるものは遷移、外部掲載の通達は「開発中」ページで接続先を明示します。</p>
    <h3 class="m-h">ナレッジ</h3>
    <div class="know-list">${cards}</div>
    <h3 class="m-h" style="margin-top:18px">通達・共有（ポータルと同じ一覧）</h3>
    <div class="know-list">${feed}</div>
  </div>`;
  $('knowBack').onclick=()=>go('portal');
  const openAnn=a=>{ if(a.go){ if(a.view) state.view=a.view; go(a.go); } else if(a.wip) goWip(a.wip); else goWip('ann-gws'); };
  $('main').querySelectorAll('[data-ki]').forEach(b=>b.onclick=()=>{
    const k=KNOWLEDGE[Number(b.dataset.ki)];
    if(k.wip) goWip(k.wip);
    else { if(k.view) state.view=k.view; go(k.go); }
  });
  $('main').querySelectorAll('[data-ai]').forEach(b=>b.onclick=()=>openAnn(ANNOUNCEMENTS[Number(b.dataset.ai)]));
}

const PIN_BY_ROLE={
  sales:['sfa','ringi','order','koji'],
  leader:['ringi','sfa','billing','jimu'],
  kanri:['billing','ringi','sfa','jimu'],
  buy:['buy','order','stock','sfa'],
  koji:['koji','order','sfa','ringi'],
  jimu:['jimu','sfa','billing','ringi'],
};
function renderPortal(){
  const r=ROLES[state.role];
  const mine=issues.filter(i=>i.own===state.role && i.open && i.status!=='Done' && i.kind!=='deal' && i.kind!=='phase');
  const myApps=(PIN_BY_ROLE[state.role]||['sfa','ringi','koji','billing']).filter(id=>REPOS[id]);

  /* 左: 自分のアプリ（GitHub Top repositories 相当） */
  const appRows=myApps.map(id=>{
    const a=REPOS[id];
    const n=issues.filter(i=>i.repo===id && i.open).length;
    return `<button type="button" class="app-row" data-repo="${id}" ${a.stub?'data-stub="1"':''}>
      <span class="sw" style="background:${APP_COLORS[id]||'#6e7781'}"></span>${a.label}${n?`<span class="cnt">${n}</span>`:''}
    </button>`;
  }).join('')+`
    <button type="button" class="app-row" data-screen="crm"><span class="sw" style="background:#57606a"></span>顧客｜物件マスタ</button>`;

  const scRows=SHORTCUTS.map(s=>`
    <button type="button" class="sc-row" data-ext="${s.id}"><span class="ic"></span>${s.label}${s.ext?`<span class="ext">${s.ext}</span>`:''}</button>`).join('');

  /* 中央: 自分宛（Issue行スタイル）＋ 通達フィード */
  const rootOf=it=>{ let x=it; while(x&&x.parent){ x=byId(x.parent); } return x; };
  const othersOpen=i=>i.open && i.own!==state.role && i.status!=='Done' && !['deal','phase'].includes(i.kind);
  let waitingOnOthers=issues.filter(i=>{ const root=rootOf(i); return othersOpen(i) && root && root.own===state.role; });
  let othersLabel='自分の案件で他の人を待っている';
  if(!waitingOnOthers.length){
    waitingOnOthers=issues.filter(i=>othersOpen(i) && ['承認待ち','Blocked','差戻し'].includes(i.status));
    othersLabel='拠点で止まっている行（担当外）';
  }
  const wkRow=i=>{
    const cls=i.status==='差戻し'?' back':['承認待ち','Blocked'].includes(i.status)?' warn':'';
    return `<button type="button" class="wk-row" data-open="${i.id}" title="${i.title}">
      <span class="st${cls}"></span>
      <span class="t"><span class="kind ${KC[i.kind]}">${KIND[i.kind]}</span>${i.title}</span>
      <span class="ref">${i.ref}</span>
      ${pill(i.status)}
      <span class="wt">⏳ ${waitingOf(i).t}</span>
    </button>`;
  };
  const wkRows=(mine.length
      ? mine.slice(0,8).map(wkRow).join('')
      : '<div class="wk-empty">未完了の自分宛はありません</div>')
    + (waitingOnOthers.length
      ? `<div class="wk-sub">${othersLabel}（${waitingOnOthers.length}）</div>`+waitingOnOthers.slice(0,6).map(wkRow).join('')
      : '');

  const unread=ANNOUNCEMENTS.filter(a=>!a.read).length;
  const feed=ANNOUNCEMENTS.map((a,i)=>{
    const [dt,from]=a.when.split(' · ');
    return `<button type="button" class="feed-row" data-ai="${i}" title="${a.title}">
      <span class="ud${a.read?' read':''}"></span>
      <span class="fl ${a.cls||'info'}">${a.tag}</span>
      <span class="t${a.read?' read':''}">${a.title}</span>
      <span class="fr">${from||''}</span>
      <span class="dt">${dt}</span>
    </button>`;
  }).join('');

  /* 右: 今日 ＋ ページ ＋ 最近の動き（system event） */
  const todayByRole={
    sales:[
      {tm:'9:00',t:'横浜支店ビル 現地調査', open:'841-t1'},
      {tm:'13:30',t:'藤沢 定期点検の訪問', screen:'crm', axis:'property'},
      {tm:'17:00',t:'見積提示の期限（関連: 見積ドラフト）', open:'841-t2'},
    ],
    koji:[
      {tm:'8:30',t:'現場入場（ゲート開通待ち）', open:'841-gate'},
      {tm:'15:00',t:'作業報告・写真アップ', view:'kojiv'},
    ],
    leader:[{tm:'10:00',t:'承認キューの確認', view:'approvals'},{tm:'16:00',t:'締め・進捗レビュー', view:'all'}],
    kanri:[{tm:'10:00',t:'高額稟議・請求キュー', view:'approvals'},{tm:'16:00',t:'請求Viewの確認', view:'billingv'}],
    buy:[{tm:'10:00',t:'購買申請キュー', view:'procurement'},{tm:'16:00',t:'発注進捗の確認', view:'procurement'}],
    jimu:[{tm:'10:00',t:'事務宿題の確認', view:'mine'},{tm:'16:00',t:'書類・契約の進捗', screen:'crm'}],
  };
  const today=(todayByRole[state.role]||todayByRole.leader)
    .map((x,i)=>`<button type="button" class="today-row btnish" data-ti="${i}"><span class="tm">${x.tm}</span><span>${x.t}</span></button>`).join('');

  const recent=[];
  issues.forEach(i=>(i.tl||[]).forEach(e=>{ if(e.t==='sys') recent.push({id:i.id, ref:i.ref, text:e.text}); }));
  const rec=recent.slice(-4).reverse().map(e=>`<li><button type="button" data-open="${e.id}"><b>${e.ref}</b><br>${e.text}</button></li>`).join('');

  $('main').innerHTML=`<div class="portal">
    <aside class="db-side">
      <div class="db-me"><span class="av">${r.short}</span><div><b>${PEOPLE[state.role]}</b><small>${r.label}</small></div></div>
      <h4 class="db-h">自分のアプリ<button type="button" class="more" id="goSpaces">すべて</button></h4>
      <div class="app-list">${appRows}</div>
      <h4 class="db-h">ショートカット</h4>
      <div class="sc-list">${scRows}</div>
    </aside>
    <div class="db-main">
      <div class="sec-h"><h3>自分の申請</h3><button type="button" class="more" id="goMy">すべて →</button></div>
      <div class="my-sum">${(()=>{ const rs=myReqRows(); const n=s=>rs.filter(r=>r.st===s).length;
        return [['draft','下書き',n('下書き')],['wait','申請中',n('申請中')],['back','差戻し',n('差戻し')],['done','承認済・完了',n('承認済・完了')]]
          .map(([k,l,c])=>`<button type="button" data-myg="${k}" class="${k==='back'&&c?'hot':''}">${l} <b>${c}</b></button>`).join('')
          +'<button type="button" id="portalNew">＋ 新規（稟議・購買・見積…）</button>'; })()}</div>
      <div class="db-sec">
        <div class="sec-h"><h3>自分宛</h3><span class="cnt">${mine.length}</span><button type="button" class="more" id="goMine">宿題View →</button></div>
        <div class="wk-list">${wkRows}</div>
      </div>
      <div class="db-sec">
        <div class="sec-h"><h3>社内共有・通達</h3><span class="cnt">未読 ${unread}</span><button type="button" class="more" data-ext="know">アーカイブ →</button></div>
        <div class="feed-list">${feed}</div>
      </div>
    </div>
    <aside class="db-rail">
      <button type="button" class="rail-cta" id="goBoard">案件台帳を開く →</button>
      <div class="rail-sec">
        <h4 class="db-h">今日</h4>
        <div class="today-list">${today}</div>
      </div>
      <div class="rail-sec">
        <h4 class="db-h">ページ</h4>
        <div class="sc-list">
          <button type="button" class="sc-row" data-screen="crm"><span class="ic"></span>マスタ（顧客｜物件）</button>
          <button type="button" class="sc-row" data-screen="mgmt"><span class="ic"></span>管理（一覧・台帳・登録）</button>
          <button type="button" class="sc-row" data-screen="search"><span class="ic"></span>横断検索（過去案件）</button>
          <button type="button" class="sc-row" data-screen="structure"><span class="ic"></span>全体構成</button>
          <button type="button" class="sc-row" data-screen="manual"><span class="ic"></span>使い方</button>
          <button type="button" class="sc-row" data-screen="knowledge"><span class="ic"></span>ナレッジ・通達</button>
        </div>
      </div>
      <div class="rail-sec">
        <h4 class="db-h">最近の動き</h4>
        <ul class="tlm">${rec}</ul>
      </div>
    </aside>
  </div>`;

  $('goBoard').onclick=()=>go('board');
  $('goMy').onclick=()=>go('myreq');
  $('portalNew').onclick=()=>{ renderNewMenu(); $('newMenu').classList.add('open'); };
  $('main').querySelectorAll('[data-myg]').forEach(b=>b.onclick=()=>{ state.myTab=b.dataset.myg; go('myreq'); });
  $('goMine').onclick=()=>{ state.view='mine'; go('board'); };
  $('goSpaces').onclick=()=>go('spaces');
  $('main').querySelectorAll('[data-ext]').forEach(b=>b.onclick=()=>openShortcut(b.dataset.ext));
  $('main').querySelectorAll('[data-open]').forEach(b=>b.onclick=()=>openIssue(b.dataset.open));
  $('main').querySelectorAll('[data-ai]').forEach(b=>b.onclick=()=>{
    const a=ANNOUNCEMENTS[Number(b.dataset.ai)];
    a.read=true;
    if(a.go){ if(a.view) state.view=a.view; go(a.go); }
    else if(a.wip) goWip(a.wip); else openShortcut('know');
  });
  $('main').querySelectorAll('[data-screen]').forEach(b=>b.onclick=()=>go(b.dataset.screen));
  $('main').querySelectorAll('[data-repo]').forEach(b=>b.onclick=()=>go('repo',{repo:b.dataset.repo}));
  const todayList=todayByRole[state.role]||todayByRole.leader;
  $('main').querySelectorAll('[data-ti]').forEach(b=>b.onclick=()=>{
    const x=todayList[Number(b.dataset.ti)];
    if(x.open) openIssue(x.open);
    else if(x.screen){ if(x.axis) state.crmAxis=x.axis; go(x.screen); }
    else if(x.view){ state.view=x.view; go('board'); }
    else go('board');
  });
}

    if(o.page.includes('物流')) g='items';
    else if(o.page.includes('物件')) g='crm-prop';
    else if(o.page.includes('顧客')||o.page.includes('マスタ')) g='crm';
    else if(o.page.includes('請求')) g='board-bill';
    else if(o.page.includes('購買')) g='board-proc';
    else if(o.page.includes('施工')) g='board-koji';
    else if(o.page.includes('稟議')) g='board-apr';
    else if(o.page.includes('受注事務')) g='repo-jimu';

      <th>優先</th><th>カテゴリ</th><th>アプリ</th><th>共有データ</th>

    <h3 class="m-h" style="margin-top:18px">3. ページ4層</h3>

function rowsForView(){
  const v=VIEWS.find(x=>x.id===state.view);
  if(v.tree){
    return issues.filter(i=>{
      if(i.depth===0) return true;
      let p=i.parent; while(p){ if(!state.expanded.has(p)) return false; const par=byId(p); p=par&&par.parent; }
      return true;
    }).map(i=>({it:i, ctx:false}));
  }
  const hit=issues.filter(v.f);
  const set=new Map();
  hit.forEach(i=>{
    let p=i.parent; const chain=[];
    while(p){ chain.unshift(p); const par=byId(p); p=par&&par.parent; }
    chain.forEach(cid=>{ if(!set.has(cid)) set.set(cid,{it:byId(cid), ctx:true}); });
    set.set(i.id,{it:i, ctx:false});
  });
  return issues.filter(i=>set.has(i.id)).map(i=>set.get(i.id));
}

function custStats(cid){
  const list=custIssues(cid);
  const deals=list.filter(i=>i.kind==='deal');
  const activeDeals=deals.filter(i=>i.open);
  const leads=list.filter(i=>i.kind==='lead'&&i.open);
  return {deals, activeDeals, leads, all:list};
}
const CRM_PAGE_SIZE=25;
function crmFiltered(){
  const q=(state.crmQ||'').trim();
  let list=state.crmAxis==='property' ? propRows() : crmRows();
  if(q){
    list=list.filter(r=>{
      const hay=state.crmAxis==='property'
        ? (r.name+(r.structure||'')+r.domain+r.branch+r.regi+(r.addr||''))
        : (r.name+r.kind+r.domain+r.branch+r.regi);
      return hay.includes(q);
    });
  }
  return list;
}
function crmTableHtml(){
  const list=crmFiltered();
  const pages=Math.max(1, Math.ceil(list.length/CRM_PAGE_SIZE));
  if(state.crmPage>=pages) state.crmPage=pages-1;
  const start=state.crmPage*CRM_PAGE_SIZE;
  const slice=list.slice(start, start+CRM_PAGE_SIZE);
  const body = state.crmAxis==='property'
    ? slice.map(r=>`<tr data-prop="${r.id}" style="cursor:pointer">
        <td><b>${r.name}</b>${r.gen?'':' <span class="ref">詳細あり</span>'}</td>
        <td>${r.structure||'—'}</td>
        <td>${r.regi==='仮'?'<span class="pill wait">仮登録</span>':'<span class="pill">本登録</span>'}</td>
        <td class="orgcell">${r.domain}・${r.branch.replace('営業所','')}</td>
        <td>${r.custs}</td>
        <td>${r.active||'—'}</td>
        <td>${r.until}${r.warn?' <span class="warn-badge">期限間近</span>':''}</td>
        <td>${r.last}</td>
      </tr>`).join('')
    : slice.map(r=>`<tr data-cust="${r.id}" style="cursor:pointer">
        <td><b>${r.name}</b>${r.gen?'':' <span class="ref">詳細あり</span>'}</td>
        <td>${r.kind}</td>
        <td>${r.regi==='仮'?'<span class="pill wait">仮登録</span>':'<span class="pill">本登録</span>'}</td>
        <td class="orgcell">${r.domain}・${r.branch.replace('営業所','')}</td>
        <td>${r.props}</td>
        <td>${r.active||'—'}</td>
        <td>${r.until}${r.warn?' <span class="warn-badge">期限間近</span>':''}</td>
        <td>${r.last}</td>
      </tr>`).join('');
  return {body, total:list.length, start, end:Math.min(start+CRM_PAGE_SIZE, list.length), pages};
}

const SEQ={sfa:2300, ringi:20, buy:40, n:0};
function nextRef(repo){ SEQ[repo]=(SEQ[repo]||0)+1; return `${repo}#${SEQ[repo]}`; }
function nextId(){ SEQ.n++; return 'n'+SEQ.n; }
function yen(n){ return '¥'+Number(n||0).toLocaleString(); }
function meShort(){ return PEOPLE[state.role].replace(/（.*）/,''); }
function mlog(r,text){ (r.log=r.log||[]).unshift(`9/25 ${meShort()}: ${text}`); }
function mpill(s){
  const m={'対象':'wait','案内済':'wait','発行待ち':'wait','入金待ち':'wait','登録申請中':'wait','請求前':'block','一部入金':'wait',
    'アポ済':'prog','発行済':'prog','点検済':'done','送付済':'done','消込済':'done','未実施':'back','期日超過':'back','停止':'back'};
  return `<span class="pill ${m[s]||''}">${s}</span>`;
}
function insertIssue(o){
  if(!o.parent){ issues.push(o); return o; }
  const par=byId(o.parent); o.depth=par.depth+1;
  const inSub=i=>{ let p=i.parent; while(p){ if(p===o.parent) return true; const x=byId(p); p=x&&x.parent; } return false; };
  let idx=issues.indexOf(par);
  issues.forEach((i,k)=>{ if(inSub(i)) idx=Math.max(idx,k); });
  issues.splice(idx+1,0,o); state.expanded.add(o.parent);
  return o;
}

}

function whyHtml(c, extra=''){
  return `<div class="mg-why ${extra}"><div><b>ASISでは</b>${c.asis}</div><div><b>なぜ必要だったか</b>${c.why}</div><div class="stop"><b>やめること</b>${c.stop}</div><div><b>主に使う人</b>${c.who}</div></div>`;
}
function renderMgmt(){
  const key=state.mgmtKey;
  if(!key){ renderMgmtIndex(); return; }
  if(key==='schedule'){ renderSchedule(); return; }
  const c=MGMT[key]; if(!c){ renderMgmtIndex(); return; }
  const all=c.rows();
  state.mgmtTab=state.mgmtTab||{};
  const tab=c.tabs.find(t=>t.id===state.mgmtTab[key])||c.tabs[0];
  const q=(state.mgmtQ||'').trim();
  const rows=all.filter(tab.f).filter(r=>!q||c.q(r).includes(q));
  const seg=c.tabs.map(t=>`<button type="button" role="tab" data-mt="${t.id}" aria-selected="${t.id===tab.id}">${t.label} <span class="ref">${all.filter(t.f).length}</span></button>`).join('');
  const head=c.cols.map(x=>`<th>${x.h}</th>`).join('')+'<th>操作</th><th>最新の記録</th>';
  const body=rows.map(r=>{
    const acts=(c.acts(r)||[]).map((a,i)=>`<button type="button" class="sp-act${a.c==='bp'?' pri':''}" data-mr="${r.id}" data-mi="${i}">${a.l}</button>`).join('');
    const lg=(r.log||[])[0]||'—';
    return `<tr>${c.cols.map(x=>`<td>${x.v(r)}</td>`).join('')}<td><div class="acts" style="display:flex;gap:4px;flex-wrap:wrap">${acts||'—'}</div></td><td class="mg-log" title="${lg}">${lg}</td></tr>`;
  }).join('');
  $('main').innerHTML=`<div class="mg-page">
    <div class="mg-top"><button type="button" class="linkbtn" id="mgBack">← 管理一覧</button><h2>${c.title}</h2>
      ${(c.tools||[]).map((t,i)=>`<button type="button" class="bp" data-mtool="${i}">${t.l}</button>`).join('')}
      <button type="button" class="bg" id="mgCsv" ${(c.tools||[]).length?'':'style="margin-left:auto"'}>CSV出力</button></div>
    ${whyHtml(c)}
    <div class="filterbar"><div class="seg" role="tablist">${seg}</div>
      <input class="mg-q" id="mgQ" value="${state.mgmtQ||''}" placeholder="この台帳を検索">
      <span class="count">${rows.length} 件 / 全 ${all.length} 件</span></div>
    <div class="table-wrap"><table class="ledger"><thead><tr>${head}</tr></thead>
      <tbody>${body||`<tr><td colspan="${c.cols.length+2}" class="quiet">該当なし</td></tr>`}</tbody></table></div>
    ${c.foot?`<div class="add-row">${c.foot(all)}</div>`:''}</div>`;
  $('mgBack').onclick=()=>go('mgmt',{mgmt:null});
  $('mgCsv').onclick=()=>{
    const strip=h=>{ const d=document.createElement('div'); d.innerHTML=h; return d.textContent.replace(/"/g,'""').trim(); };
    const csv=[c.cols.map(x=>`"${x.h}"`).join(',')].concat(rows.map(r=>c.cols.map(x=>`"${strip(x.v(r))}"`).join(','))).join('\r\n');
    const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob(['\ufeff'+csv],{type:'text/csv'})); a.download=`${c.title}.csv`; a.click();
  };
  $('main').querySelectorAll('[data-mt]').forEach(b=>b.onclick=()=>{ state.mgmtTab[key]=b.dataset.mt; render(); });
  $('main').querySelectorAll('[data-mtool]').forEach(b=>b.onclick=()=>c.tools[Number(b.dataset.mtool)].f());
  $('main').querySelectorAll('[data-mr]').forEach(b=>b.onclick=()=>{
    const r=all.find(x=>String(x.id)===b.dataset.mr); if(!r) return;
    const a=(c.acts(r)||[])[Number(b.dataset.mi)]; if(!a) return;
    if(a.f()!=='nav') render();
  });
  const qi=$('mgQ');
  qi.addEventListener('input',e=>{ state.mgmtQ=e.target.value; render(); const el=$('mgQ'); el.focus(); el.setSelectionRange(el.value.length,el.value.length); });
}

function fieldHtml(f, pre){
  const val=k=>pre[k]!==undefined?pre[k]:'';
  const lab=`<label>${f.l}${f.req?'<span class="req">*</span>':''}</label>`;
  if(f.t==='line'){
    const d=f.def||['','',''];
    return `<div class="full">${lab}<div class="line">
      <input name="${f.k}n" value="${pre[f.k+'n']??d[0]}" placeholder="品目"><input name="${f.k}q" type="number" value="${pre[f.k+'q']??d[1]}" placeholder="数量"><input name="${f.k}p" type="number" value="${pre[f.k+'p']??d[2]}" placeholder="単価"></div></div>`;
  }
  const v=val(f.k)!==''?val(f.k):(f.def||'');
  let input;
  if(f.t==='select') input=`<select name="${f.k}">${f.opts().map(([o,l])=>`<option value="${o}" ${String(o)===String(v)?'selected':''}>${l}</option>`).join('')}</select>`;
  else if(f.t==='textarea') input=`<textarea name="${f.k}">${v}</textarea>`;
  else input=`<input name="${f.k}" ${f.t==='number'?'type="number"':''} value="${v}">`;
  return `<div class="${f.full?'full':''}">${lab}${input}</div>`;
}
function renderFormLegacy(){
  const key=state.formKey;
  if(!key || !FORMS[key]){
    const rows=Object.entries(FORMS).map(([k,f])=>`<tr><td><button type="button" class="linkbtn" data-fk="${k}" style="font-size:12.5px"><b>${f.title}</b></button></td><td style="font-size:11.5px;color:var(--muted)">${f.asis}</td></tr>`).join('');
    $('main').innerHTML=`<div class="pad"><button type="button" class="m-back" id="fmBack">← 管理一覧</button>
      <h2 class="page">新しく登録する</h2><p class="quiet">台帳に「行を足す」入口。何を登録するかを選びます。</p>
      <div class="table-wrap"><table class="ledger"><thead><tr><th style="width:30%">登録するもの</th><th>ASISでは</th></tr></thead><tbody>${rows}</tbody></table></div></div>`;
    $('fmBack').onclick=()=>go('mgmt',{mgmt:null});
    $('main').querySelectorAll('[data-fk]').forEach(b=>b.onclick=()=>go('form',{form:b.dataset.fk}));
    return;
  }
  const f=FORMS[key], pre=state.formPre||{}, done=state.formDone;
  $('main').innerHTML=`<div class="pad">
    <button type="button" class="m-back" id="fmBack">← 管理一覧</button>
    <h2 class="page">${f.title}</h2>
    ${whyHtml(f,'static')}
    ${done?`<div class="note" style="max-width:760px">✓ ${done.msg}</div>
      <div class="actions"><button class="bp" type="button" id="fmOpen">${done.openLabel}</button><button class="bg" type="button" id="fmAgain">続けて登録</button></div>`
    :`<form id="fm" class="form-grid" onsubmit="return false">${f.fields.map(x=>fieldHtml(x,pre)).join('')}</form>
      <div class="form-prev" id="fmPrev"></div>
      <div class="actions"><button class="bp" type="button" id="fmSubmit">${f.submitLabel}</button><button class="bg" type="button" id="fmCancel">キャンセル</button></div>`}
  </div>`;
  $('fmBack').onclick=()=>go('mgmt',{mgmt:null});
  if(done){
    $('fmOpen').onclick=()=>{ state.formDone=null; done.open(); };
    $('fmAgain').onclick=()=>go('form',{form:key});
    return;
  }
  const vals=()=>{ const o={}; $('fm').querySelectorAll('[name]').forEach(el=>o[el.name]=el.value); return o; };
  const upd=()=>{ $('fmPrev').innerHTML=f.preview?f.preview(vals()):''; };
  $('fm').addEventListener('input',upd); $('fm').addEventListener('change',upd); upd();
  $('fmCancel').onclick=()=>go('mgmt',{mgmt:null});
  $('fmSubmit').onclick=()=>{
    const res=f.submit(vals());
    if(res.err){ $('fmPrev').innerHTML=`<div class="note warn">${res.err}</div>`; return; }
    state.formDone=res; state.formPre=null; render();
  };
}

/* ================= 操作の流れ: 入口・ポップアップ・下書き・自分の申請 ================= */
const DRAFTS=[];
const REQ_FORMS=['ringi','buy','quote','expense','safety'];
issues.forEach(i=>{ if(['ringi','buy'].includes(i.kind) && !i.by){ i.by='sales'; i.approver=i.own; } });
function rootOf(it){ let x=it; while(x&&x.parent) x=byId(x.parent); return x; }
function nowHM(){ const d=new Date(); return `9/25 ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`; }
function formTitleOf(key, v){
  const f=FORMS[key]; const d=v&&v.deal&&byId(v.deal);
  if(key==='ringi') return `${v.type||'稟議'}の稟議${d?`（${d.title}）`:''}`;
  if(key==='buy') return `購買申請${v.sku?`: ${itemOf(v.sku).name}`:''}${d?`（${d.title}）`:''}`;
  if(key==='quote') return `見積${d?`（${d.title}）`:''}`;
  if(key==='cust') return `顧客登録: ${v.name||'（名前未入力）'}`;
  if(key==='prop') return `物件登録: ${v.name||'（名前未入力）'}`;
  return f?f.title:key;
}
function formBodyHtml(key, pre, mode){
  const f=FORMS[key];
  return `<form class="form-grid" data-fm onsubmit="return false">${f.fields.map(x=>fieldHtml(x,pre)).join('')}
      <div class="full"><label>添付（見積書・写真など）</label><input type="file" name="__file" multiple></div></form>
    <div class="form-prev" data-fprev></div>
    <div class="actions">
      <button class="bp" type="button" data-fsubmit>${f.submitLabel}</button>
      <button class="bg" type="button" data-fdraft>下書き保存</button>
      <button class="bg" type="button" data-fcancel>${mode==='modal'?'閉じる':'キャンセル'}</button>
    </div>`;
}
/* ctx: {draftId, editId} / hooks: {done(res), cancel(dirty, vals), drafted(msg)} */
function bindForm(root, key, ctx, hooks){
  const f=FORMS[key];
  const vals=()=>{ const o={}; root.querySelectorAll('[data-fm] [name]').forEach(el=>{ if(el.name==='__file') o.__files=[...el.files].map(x=>x.name).join('、'); else o[el.name]=el.value; }); return o; };
  const initial=JSON.stringify(vals());
  const upd=()=>{ const p=root.querySelector('[data-fprev]'); if(p) p.innerHTML=(f.preview?f.preview(vals(),ctx):'')+dupWarn(key,vals(),ctx); };
  const fm=root.querySelector('[data-fm]');
  fm.addEventListener('input',upd); fm.addEventListener('change',upd); upd();
  root.querySelector('[data-fsubmit]').onclick=()=>{
    const v=vals(); const res=f.submit(v, ctx||{});
    if(res.err){ root.querySelector('[data-fprev]').innerHTML=`<div class="note warn">${res.err}</div>`; return; }
    if(ctx&&ctx.draftId){ const i=DRAFTS.findIndex(d=>d.id===ctx.draftId); if(i>=0) DRAFTS.splice(i,1); }
    if(v.__files) res.msg+=` 添付: ${v.__files}`;
    hooks.done(res);
  };
  root.querySelector('[data-fdraft]').onclick=()=>{
    const v=vals(); saveDraft(key, v, ctx);
    hooks.drafted(`下書きに保存しました（${nowHM()}）。ヘッダ「自分の申請」→ 下書き から再開できます。`);
  };
  root.querySelector('[data-fcancel]').onclick=()=>hooks.cancel(JSON.stringify(vals())!==initial, vals());
}
function saveDraft(key, v, ctx){
  let d=ctx&&ctx.draftId?DRAFTS.find(x=>x.id===ctx.draftId):null;
  if(!d){ d={id:'dr'+(DRAFTS.length+1)+'-'+SEQ.n++, form:key, by:state.role}; DRAFTS.unshift(d); if(ctx) ctx.draftId=d.id; }
  d.vals=v; d.title=formTitleOf(key,v); d.saved=nowHM();
  return d;
}
function dupWarn(key, v, ctx){
  if(key!=='ringi' || !v.deal || (ctx&&ctx.editId)) return '';
  const same=issues.filter(i=>i.kind==='ringi' && rootOf(i)&&rootOf(i).id===v.deal && i.status==='承認待ち' && (i.body&&i.body['種類']===v.type || i.title.startsWith(v.type)));
  return same.length?`<div class="note warn">同じ案件に申請中の「${v.type}」稟議があります: ${same.map(s=>s.ref).join('、')}（二重申請に注意）</div>`:'';
}

/* ---- ポップアップ ---- */
function ensureModal(){
  if($('modal')) return;
  const m=document.createElement('div'); m.id='modal'; m.className='modal';
  m.innerHTML='<div class="modal-box" id="modalBox" role="dialog" aria-modal="true"></div>';
  document.body.appendChild(m);
}
function openFormModal(key, pre, ctx){
  ensureModal();
  const f=FORMS[key]; ctx=ctx||{};
  const box=$('modalBox');
  const head=`<div class="modal-h"><h3>${ctx.editId?'修正して再申請: ':''}${f.title}</h3><button class="x" type="button" data-mclose aria-label="閉じる">×</button></div>
    <p class="quiet" style="margin:0 0 10px">${ctx.from?`${ctx.from} から開いています（閉じると元の画面に戻ります）。`:''}主に使う人: ${f.who}</p>`;
  box.innerHTML=head+formBodyHtml(key, pre||{}, 'modal')+'<div data-mconfirm></div>';
  $('modal').classList.add('open');
  const close=()=>{ $('modal').classList.remove('open'); box.innerHTML=''; render(); };
  const doneView=(msg, openLabel, open)=>{
    box.innerHTML=`<div class="modal-h"><h3>${f.title}</h3><button class="x" type="button" data-mclose>×</button></div>
      <div class="note">✓ ${msg}</div>
      <div class="actions">${open?`<button class="bp" type="button" data-mopen>${openLabel}</button>`:''}<button class="bg" type="button" data-mmy>自分の申請を見る</button><button class="bg" type="button" data-mclose2>閉じる</button></div>`;
    box.querySelector('[data-mclose]').onclick=close; box.querySelector('[data-mclose2]').onclick=close;
    box.querySelector('[data-mmy]').onclick=()=>{ $('modal').classList.remove('open'); box.innerHTML=''; go('myreq'); };
    const o=box.querySelector('[data-mopen]'); if(o) o.onclick=()=>{ $('modal').classList.remove('open'); box.innerHTML=''; open(); };
  };
  const askClose=(dirty, vals)=>{
    if(!dirty){ close(); return; }
    box.querySelector('[data-mconfirm]').innerHTML=`<div class="note warn">入力した内容があります。
      <div class="actions" style="margin:8px 0 0"><button class="bp" type="button" data-cs>下書きに保存して閉じる</button><button class="bd" type="button" data-cx>破棄して閉じる</button><button class="bg" type="button" data-cb>入力に戻る</button></div></div>`;
    box.querySelector('[data-cs]').onclick=()=>{ saveDraft(key, vals, ctx); close(); };
    box.querySelector('[data-cx]').onclick=close;
    box.querySelector('[data-cb]').onclick=()=>{ box.querySelector('[data-mconfirm]').innerHTML=''; };
  };
  bindForm(box, key, ctx, {
    done:res=>doneView(res.msg, res.openLabel, res.open),
    drafted:msg=>doneView(msg),
    cancel:askClose,
  });
  box.querySelector('[data-mclose]').onclick=()=>box.querySelector('[data-fcancel]').click();
}
function openResubmit(it){
  const key=it.formKey||(it.kind==='buy'?'buy':'ringi');
  const root=rootOf(it);
  const pre=it.formVals?Object.assign({},it.formVals):{deal:root&&root.id, type:(it.body&&it.body['種類'])||it.title.replace(/の稟議$|（.*）/g,'').replace('起案',''), amount:String(it.amount||'').replace(/[^\d]/g,''), reason:''};
  openFormModal(key, pre, {editId:it.id, from:`${it.ref} の差戻し`});
}

/* ---- 専用ページ（管理 → 登録） ---- */
function renderForm(){
  const key=state.formKey;
  if(!key || !FORMS[key]){ renderFormLegacy(); return; }
  const f=FORMS[key], done=state.formDone;
  const ctx=state.formCtx||(state.formCtx={});
  $('main').innerHTML=`<div class="pad">
    <button type="button" class="m-back" id="fmBack">← 管理一覧</button>
    <h2 class="page">${f.title}</h2>
    ${whyHtml(f,'static')}
    ${done?`<div class="note" style="max-width:760px">✓ ${done.msg}</div>
      <div class="actions">${done.open?`<button class="bp" type="button" id="fmOpen">${done.openLabel}</button>`:''}<button class="bg" type="button" id="fmMy">自分の申請を見る</button><button class="bg" type="button" id="fmAgain">続けて登録</button></div>`
      : `<div id="fmRoot">${formBodyHtml(key, state.formPre||{}, 'page')}<div data-mconfirm></div></div>`}
  </div>`;
  $('fmBack').onclick=()=>go('mgmt',{mgmt:null});
  if(done){
    const o=$('fmOpen'); if(o) o.onclick=()=>{ state.formDone=null; done.open(); };
    $('fmMy').onclick=()=>go('myreq');
    $('fmAgain').onclick=()=>go('form',{form:key});
    return;
  }
  const root=$('fmRoot');
  bindForm(root, key, ctx, {
    done:res=>{ state.formDone=res; state.formPre=null; state.formCtx=null; render(); },
    drafted:msg=>{ state.formDone={msg}; state.formCtx=null; render(); },
    cancel:(dirty, vals)=>{
      if(!dirty){ go('mgmt',{mgmt:null}); return; }
      root.querySelector('[data-mconfirm]').innerHTML=`<div class="note warn">入力した内容があります。
        <div class="actions" style="margin:8px 0 0"><button class="bp" type="button" data-cs>下書きに保存して戻る</button><button class="bd" type="button" data-cx>破棄して戻る</button></div></div>`;
      root.querySelector('[data-cs]').onclick=()=>{ saveDraft(key, vals, ctx); go('mgmt',{mgmt:null}); };
      root.querySelector('[data-cx]').onclick=()=>go('mgmt',{mgmt:null});
    },
  });
}

/* ---- 自分の申請 ---- */
const EXPENSES=[], SAFETY_REPORTS=[];
function myReqRows(){
  const me=state.role, rows=[];
  DRAFTS.filter(d=>d.by===me).forEach(d=>rows.push({id:d.id, type:FORMS[d.form].title.replace(/（.*）/,''), title:d.title, st:'下書き', who:'—', upd:d.saved, draft:d}));
  issues.filter(i=>i.by===me && ['ringi','buy','task'].includes(i.kind) && (i.kind!=='task'||i.title.startsWith('見積 '))).forEach(i=>{
    const st=i.status==='取り下げ'?'取り下げ':i.status==='差戻し'?'差戻し':i.status==='Done'?'承認済・完了':'申請中';
    rows.push({id:i.id, type:i.kind==='ringi'?'稟議':i.kind==='buy'?'購買申請':'見積', title:`${i.title} ${i.ref}`, st, who:PEOPLE[i.own], upd:(i.tl.length?'9/25':'—'), amount:i.amount, issue:i});
  });
  EXPENSES.filter(e=>e.by===me).forEach(e=>rows.push({id:e.id, type:'経費', title:e.title, st:e.status, who:'経理', upd:e.date, amount:yen(e.amount), rec:e}));
  SAFETY_REPORTS.filter(e=>e.by===me).forEach(e=>rows.push({id:e.id, type:'安全報告', title:e.title, st:e.status, who:'安全衛生課', upd:e.date, rec:e}));
  return rows;
}
function renderMyReq(){
  const all=myReqRows();
  const tabs=[['all','すべて',r=>true],['draft','下書き',r=>r.st==='下書き'],['wait','申請中',r=>r.st==='申請中'||r.st==='確認中'],['back','差戻し',r=>r.st==='差戻し'],['done','承認済・完了',r=>r.st==='承認済・完了'||r.st==='受理'],['wd','取り下げ',r=>r.st==='取り下げ']];
  const cur=tabs.find(t=>t[0]===state.myTab)||tabs[0];
  const q=(state.myQ||'').trim();
  const rows=all.filter(cur[2]).filter(r=>!q||(r.type+r.title).includes(q));
  const stp=s=>`<span class="pill ${s==='下書き'?'block':s==='差戻し'?'back':s==='申請中'||s==='確認中'?'wait':s==='取り下げ'?'block':'done'}">${s}</span>`;
  const act=r=>{
    if(r.draft) return `<button class="sp-act pri" data-dr="${r.id}">再開</button><button class="sp-act" data-dd="${r.id}">削除</button>`;

  const deals=issues.filter(i=>i.kind==='deal'), leads=issues.filter(i=>i.kind==='lead'&&i.open);
  const paidSum=PAYMENTS.filter(r=>pst(r)==='消込済').reduce((s,r)=>s+r.amount,0);
  const waitSum=PAYMENTS.filter(r=>['入金待ち','一部入金','期日超過'].includes(pst(r))).reduce((s,r)=>s+r.amount,0);
  const salesSum=SALESREC.filter(r=>srst(r)==='計上済'&&r.month==='2026-09').reduce((s,r)=>s+r.amount,0);
  const ringiWait=issues.filter(i=>i.kind==='ringi'&&i.status==='承認待ち').length;
  const hide=state.role==='koji';
  const kpi=[['今月の計上売上',hide?'（非表示）':yen(salesSum),'売上計上'],['入金済（消込）',hide?'（非表示）':yen(paidSum),'入金・消込'],['未回収（入金待ち＋超過）',hide?'（非表示）':yen(waitSum),'入金・消込'],
    ['進行中の案件',`${deals.filter(d=>d.open).length} 件`,'案件台帳'],['未対応リード',`${leads.length} 件`,'案件台帳'],['承認待ちの稟議',`${ringiWait} 件`,'稟議View'],
    ['点検の未実施',`${INSPECTIONS.filter(r=>r.status==='未実施').length} 件`,'定期点検'],['安全在庫割れ',`${STOCK.filter(s=>s.qty<s.safety).length} 品目`,'在庫'],['保証書の発行待ち',`${WARRANTIES.filter(w=>w.status==='発行待ち').length} 件`,'保証書']];
  const byBranch={}; SALESREC.concat([]).forEach(()=>{});
  issues.filter(i=>i.kind==='deal').forEach(d=>{ const k=`${d.division}・${d.branch}`; byBranch[k]=byBranch[k]||{open:0,done:0}; d.open?byBranch[k].open++:byBranch[k].done++; });
  $('main').innerHTML=`<div class="pad">
    <h2 class="page">経営・BI（拠点の数字）</h2>
    ${whyHtml({asis:'日計表・日報・歩合／報奨・社長提出資料をExcelで集計し転記', why:'拠点と会社の数字を毎日見て判断する', stop:'集計のためだけのExcel転記（数字は台帳からそのまま出す）', who:'拠点長・管理職・経営'},'static')}
    <div class="grid3">${kpi.map(k=>`<div class="card"><span class="tag">${k[2]}</span><h3 style="font-size:20px">${k[1]}</h3><p>${k[0]}</p></div>`).join('')}</div>
    <h3 class="m-h" style="margin-top:16px">拠点別の案件</h3>
    <div class="table-wrap"><table class="ledger"><thead><tr><th>部門・拠点</th><th>進行中</th><th>完了</th></tr></thead><tbody>
      ${Object.entries(byBranch).map(([k,v])=>`<tr><td class="orgcell">${k}</td><td>${v.open}</td><td>${v.done}</td></tr>`).join('')}</tbody></table></div>
    <div class="note" style="max-width:960px">この画面の数字は、案件台帳・入金・売上計上・点検・在庫の台帳からその場で集計している（転記していない）。歩合・報奨の計算ルールは要件確定後に追加。</div>
  </div>`;
}

/* ================= boot ================= */
Object.entries(ROLES).forEach(([id,r])=>{
  const b=document.createElement('button'); b.type='button'; b.className='role'; b.textContent=r.label; b.dataset.role=id;
  b.onclick=()=>setRole(id); $('roles').appendChild(b);
});
$('bellBtn').onclick=()=>{ $('newMenu').classList.remove('open'); $('notif').classList.toggle('open'); };
$('newBtn').onclick=()=>{ $('notif').classList.remove('open'); renderNewMenu(); $('newMenu').classList.toggle('open'); };
$('myBtn').onclick=()=>{ $('newMenu').classList.remove('open'); go('myreq'); };
$('search').addEventListener('keydown',e=>{ if(e.key==='Enter'){ e.preventDefault(); state.searchQ=e.target.value; go('search'); }});
$('app').addEventListener('wheel', e=>{
  const main=$('main'); if(!main) return;
  const oy=getComputedStyle(main).overflowY;
  if(oy!=='auto' && oy!=='scroll') return;
  if(main.scrollHeight<=main.clientHeight+1) return;
  let el=e.target;
  while(el && el!==main && el!==$('app')){
    const s=getComputedStyle(el);
    if((s.overflowY==='auto'||s.overflowY==='scroll') && el.scrollHeight>el.clientHeight+1) return;
    el=el.parentElement;
  }
  if(main.contains(e.target)) return;
  e.preventDefault();
  main.scrollTop+=e.deltaY;
},{passive:false});
setRole('sales');
</script>
